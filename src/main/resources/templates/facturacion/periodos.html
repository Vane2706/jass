<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Periodos')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="app-main">
    <div th:replace="~{fragments/layout :: topbar('Periodos')}"></div>
    <section class="content">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="page-actions">
            <div><h2>Periodos de facturación</h2>
                <p>Apertura y cierre de ciclos mensuales.</p></div>
        </div>
        <div class="row g-4">
            <div class="col-lg-4">
                <form class="surface form-surface" th:object="${periodo}" th:action="@{/facturacion/periodos}"
                      method="post"><h3>Nuevo periodo</h3><label>Año</label><input class="form-control" type="number"
                                                                                   th:field="*{anio}" required><label
                        class="mt-3">Mes</label><input class="form-control" type="number" min="1" max="12"
                                                       th:field="*{mes}" required>
                    <button class="btn btn-primary w-100 mt-4">Crear periodo</button>
                </form>
            </div>
            <div class="col-lg-8">
                <div class="surface">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Periodo</th>
                            <th>Inicio</th>
                            <th>Fin</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p:${periodos}">
                            <td><b th:text="${p.mes + '/' + p.anio}"></b></td>
                            <td th:text="${p.fechaInicio}"></td>
                            <td th:text="${p.fechaFin}"></td>
                            <td th:text="${p.estado}"></td>
                            <td class="text-end">
                                <form class="d-inline" th:if="${p.estado == 'ABIERTO'}"
                                      th:action="@{/facturacion/periodos/{id}/cerrar(id=${p.idPeriodo})}" method="post">
                                    <button class="btn btn-sm btn-outline-danger">Cerrar</button>
                                </form>
                                <form class="d-inline" th:if="${p.estado != 'ABIERTO'}"
                                      th:action="@{/facturacion/periodos/{id}/abrir(id=${p.idPeriodo})}" method="post">
                                    <button class="btn btn-sm btn-outline-primary">Abrir</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
