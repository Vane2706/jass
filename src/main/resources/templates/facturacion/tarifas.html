<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tarifas')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="app-main">
    <div th:replace="~{fragments/layout :: topbar('Tarifas')}"></div>
    <section class="content">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="page-actions">
            <div><h2>Configuración de tarifas</h2>
                <p>Rangos de consumo, importes fijos y precio por m³.</p></div>
        </div>
        <div class="row g-4">
            <div class="col-xl-4">
                <form class="surface form-surface" th:object="${tarifa}" th:action="@{/facturacion/tarifas}"
                      method="post"><h3>Nueva tarifa</h3><label>Tipo de servicio</label><select class="form-select"
                                                                                                th:field="*{tipoServicio.idTipoServicio}"
                                                                                                required>
                    <option value="">Seleccione…</option>
                    <option th:each="t:${tipos}" th:value="${t.idTipoServicio}" th:text="${t.nombre}"></option>
                </select><label class="mt-3">Nombre</label><input class="form-control" th:field="*{nombre}">
                    <div class="row g-2 mt-1">
                        <div class="col"><label>Mín. m³</label><input class="form-control" type="number" step="0.01"
                                                                      th:field="*{consumoMinimo}"></div>
                        <div class="col"><label>Máx. m³</label><input class="form-control" type="number" step="0.01"
                                                                      th:field="*{consumoMaximo}"></div>
                    </div>
                    <div class="row g-2 mt-1">
                        <div class="col"><label>Fijo S/</label><input class="form-control" type="number" step="0.01"
                                                                      th:field="*{importeFijo}"></div>
                        <div class="col"><label>Precio m³</label><input class="form-control" type="number" step="0.01"
                                                                        th:field="*{precioM3}"></div>
                    </div>
                    <label class="mt-3">Inicio</label><input class="form-control" type="date" th:field="*{fechaInicio}"><label
                            class="mt-3">Fin</label><input class="form-control" type="date" th:field="*{fechaFin}">
                    <button class="btn btn-primary w-100 mt-4">Guardar tarifa</button>
                </form>
            </div>
            <div class="col-xl-8">
                <div class="surface">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Tarifa</th>
                            <th>Rango</th>
                            <th>Fijo</th>
                            <th>m³</th>
                            <th>Vigencia</th>
                            <th>Estado</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="t:${tarifas}">
                            <td th:text="${t.tipoServicio.nombre}"></td>
                            <td><b th:text="${t.nombre}"></b></td>
                            <td th:text="${(t.consumoMinimo ?: '0') + ' – ' + (t.consumoMaximo ?: '∞')}"></td>
                            <td th:text="${'S/ ' + (t.importeFijo ?: 0)}"></td>
                            <td th:text="${'S/ ' + (t.precioM3 ?: 0)}"></td>
                            <td th:text="${(t.fechaInicio ?: '—') + ' / ' + (t.fechaFin ?: '—')}"></td>
                            <td th:text="${t.estado}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
