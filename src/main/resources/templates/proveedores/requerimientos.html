<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Requerimientos')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="app-main">
    <div th:replace="~{fragments/layout :: topbar('Requerimientos')}"></div>
    <section class="content">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="page-actions">
            <div><h2>Requerimientos</h2>
                <p>Compras y solicitudes a proveedores.</p></div>
        </div>
        <div class="row g-4">
            <div class="col-lg-4">
                <form class="surface form-surface" th:action="@{/proveedores/requerimientos}" method="post"><h3>Nuevo
                    requerimiento</h3><label>Proveedor</label><select class="form-select" name="idProveedor">
                    <option th:each="p:${proveedores}" th:value="${p.idProveedor}" th:text="${p.razonSocial}"></option>
                </select><label class="mt-3">Usuario</label><select class="form-select" name="idUsuario">
                    <option th:each="u:${usuarios}" th:value="${u.idUsuario}" th:text="${u.nombres}"></option>
                </select><label class="mt-3">Descripción</label><textarea class="form-control" name="descripcion"
                                                                          required></textarea>
                    <button class="btn btn-primary w-100 mt-3">Crear requerimiento</button>
                </form>
            </div>
            <div class="col-lg-8">
                <div class="surface">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Proveedor</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r:${requerimientos}">
                            <td th:text="${'#' + r.idRequerimiento}"></td>
                            <td th:text="${r.proveedor.razonSocial}"></td>
                            <td th:text="${r.fechaRequerimiento}"></td>
                            <td th:text="${'S/ ' + r.importeTotal}"></td>
                            <td th:text="${r.estado}"></td>
                            <td><a class="btn btn-sm btn-soft"
                                   th:href="@{/proveedores/requerimientos/{id}(id=${r.idRequerimiento})}">Ver</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
