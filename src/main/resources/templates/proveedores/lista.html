<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Proveedores')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="app-main">
    <div th:replace="~{fragments/layout :: topbar('Proveedores')}"></div>
    <section class="content">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="page-actions">
            <div><h2>Directorio de proveedores</h2>
                <p>Consulta y administra la información registrada.</p></div>
            <div><a class="btn btn-outline-primary" th:href="@{/proveedores/requerimientos}">Requerimientos</a> <a
                    class="btn btn-primary" th:href="@{/proveedores/nuevo}">＋ Nuevo proveedor</a></div>
        </div>
        <div class="surface">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Razón social</th>
                        <th>RUC</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Estado</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p:${proveedores}">
                        <td><b th:text="${p.razonSocial}"></b></td>
                        <td th:text="${p.ruc}"></td>
                        <td th:text="${p.telefono}"></td>
                        <td th:text="${p.correo}"></td>
                        <td th:text="${p.estado}"></td>
                        <td><a class="btn btn-sm btn-soft" th:href="@{/proveedores/{id}(id=${p.idProveedor})}">Ver</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
