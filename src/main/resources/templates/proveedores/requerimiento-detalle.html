<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle de requerimiento')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="app-main">
    <div th:replace="~{fragments/layout :: topbar('Detalle de requerimiento')}"></div>
    <section class="content">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="page-actions">
            <div><h2 th:text="${'Requerimiento #' + requerimiento.idRequerimiento}"></h2>
                <p th:text="${requerimiento.proveedor.razonSocial}"></p></div>
            <b class="fs-4" th:text="${'S/ ' + requerimiento.importeTotal}"></b></div>
        <div class="row g-4">
            <div class="col-lg-6">
                <form class="surface form-surface"
                      th:action="@{/proveedores/requerimientos/{id}/detalle(id=${requerimiento.idRequerimiento})}"
                      method="post"><h3>Agregar material</h3><select class="form-select" name="idMaterial">
                    <option th:each="m:${materiales}" th:value="${m.idMaterial}"
                            th:text="${m.codigo + ' · ' + m.nombre}"></option>
                </select>
                    <div class="row g-2 mt-2">
                        <div class="col"><label>Cantidad</label><input class="form-control" type="number" step="0.01"
                                                                       name="cantidad" required></div>
                        <div class="col"><label>Precio unitario</label><input class="form-control" type="number"
                                                                              step="0.01" name="precioUnitario"
                                                                              required></div>
                    </div>
                    <button class="btn btn-primary mt-3">Agregar</button>
                </form>
            </div>
            <div class="col-lg-6">
                <form class="surface form-surface"
                      th:action="@{/proveedores/requerimientos/{id}/comprobante(id=${requerimiento.idRequerimiento})}"
                      method="post"><h3>Registrar comprobante</h3>
                    <div class="row g-2">
                        <div class="col"><label>Tipo</label><select class="form-select" name="tipo">
                            <option>FACTURA</option>
                            <option>BOLETA</option>
                            <option>RECIBO</option>
                        </select></div>
                        <div class="col"><label>Serie</label><input class="form-control" name="serie"></div>
                    </div>
                    <label class="mt-2">Número</label><input class="form-control" name="numero" required>
                    <div class="row g-2 mt-1">
                        <div class="col"><label>Fecha</label><input class="form-control" type="date" name="fecha"></div>
                        <div class="col"><label>Importe</label><input class="form-control" type="number" step="0.01"
                                                                      name="importe" required></div>
                    </div>
                    <label class="mt-2">Estado pago</label><select class="form-select" name="estadoPago">
                        <option>PENDIENTE</option>
                        <option>PAGADO</option>
                    </select><input type="hidden" name="archivoUrl">
                    <button class="btn btn-outline-primary mt-3">Guardar comprobante</button>
                </form>
            </div>
            <div class="col-12">
                <div class="surface"><h3>Detalle</h3>
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Material</th>
                            <th>Cantidad</th>
                            <th>P. unitario</th>
                            <th>Subtotal</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d:${detalles}">
                            <td th:text="${d.material.nombre}"></td>
                            <td th:text="${d.cantidad}"></td>
                            <td th:text="${'S/ ' + d.precioUnitario}"></td>
                            <td th:text="${'S/ ' + d.subtotal}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="col-12">
                <div class="surface"><h3>Comprobantes</h3>
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Serie/Número</th>
                            <th>Fecha</th>
                            <th>Importe</th>
                            <th>Pago</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c:${comprobantes}">
                            <td th:text="${c.tipoComprobante}"></td>
                            <td th:text="${(c.serie ?: '') + '-' + c.numero}"></td>
                            <td th:text="${c.fechaEmision}"></td>
                            <td th:text="${'S/ ' + c.importe}"></td>
                            <td th:text="${c.estadoPago}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
