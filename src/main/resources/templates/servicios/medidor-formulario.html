<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Nuevo medidor')}"></head>

<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="app-main">

    <div th:replace="~{fragments/layout :: topbar('Nuevo medidor')}"></div>

    <section class="content px-3 px-lg-4 py-4">

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <style>
            :root {
                --meter-primary: #4f7cff;
                --meter-primary-dark: #416ce5;
                --meter-primary-soft: #eef4ff;

                --meter-cyan: #39b8c9;
                --meter-cyan-soft: #ecfbfd;

                --meter-green: #3aaa83;
                --meter-green-soft: #edf9f5;

                --meter-red: #d96c75;
                --meter-red-soft: #fff0f2;

                --meter-dark: #172033;
                --meter-text: #536176;
                --meter-muted: #8491a5;

                --meter-border: #e8edf5;
                --meter-bg: #f7f9fc;
                --meter-surface: rgba(255, 255, 255, .97);

                --meter-shadow:
                    0 10px 35px rgba(55, 73, 107, .07);

                --meter-shadow-hover:
                    0 16px 42px rgba(55, 73, 107, .10);
            }

            body {
                background:
                    radial-gradient(
                        circle at 7% 4%,
                        rgba(79, 124, 255, .07),
                        transparent 26%
                    ),
                    radial-gradient(
                        circle at 94% 8%,
                        rgba(57, 184, 201, .06),
                        transparent 25%
                    ),
                    var(--meter-bg) !important;
            }

            .meter-page {
                max-width: 1180px;
                margin: 0 auto;
                animation: meterPageAppear .45s ease both;
            }

            @keyframes meterPageAppear {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }


            /* =========================================================
               ENCABEZADO
            ========================================================= */

            .meter-page-header {
                position: relative;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1.5rem;
                padding: 1.2rem 1.35rem;
                margin-bottom: 1rem;
                background:
                    linear-gradient(
                        135deg,
                        rgba(255, 255, 255, .98),
                        rgba(245, 249, 255, .97)
                    );
                border: 1px solid var(--meter-border);
                border-radius: 18px;
                box-shadow:
                    0 7px 25px rgba(55, 73, 107, .055);
            }

            .meter-page-header::before {
                content: "";
                position: absolute;
                width: 170px;
                height: 170px;
                top: -105px;
                right: 130px;
                border-radius: 50%;
                background: rgba(79, 124, 255, .045);
                pointer-events: none;
            }

            .meter-page-header::after {
                content: "";
                position: absolute;
                width: 105px;
                height: 105px;
                right: -45px;
                bottom: -70px;
                border-radius: 50%;
                background: rgba(57, 184, 201, .055);
                pointer-events: none;
            }

            .meter-header-content,
            .meter-header-action {
                position: relative;
                z-index: 2;
            }

            .meter-title-row {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: .55rem;
                margin-bottom: .22rem;
            }

            .meter-page-title {
                margin: 0;
                color: var(--meter-dark);
                font-size: 1.25rem;
                font-weight: 760;
                letter-spacing: -.025em;
            }

            .service-code-badge {
                display: inline-flex;
                align-items: center;
                min-height: 26px;
                padding: .25rem .65rem;
                color: var(--meter-primary);
                background: var(--meter-primary-soft);
                border: 1px solid rgba(79, 124, 255, .13);
                border-radius: 999px;
                font-family:
                    ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    Monaco,
                    Consolas,
                    monospace;
                font-size: .65rem;
                font-weight: 720;
                letter-spacing: .02em;
            }

            .meter-page-description {
                margin: 0;
                color: var(--meter-muted);
                font-size: .72rem;
                font-weight: 500;
            }

            .btn-back-service {
                min-height: 38px;
                padding: .52rem .95rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: .4rem;
                color: #68768b;
                background: rgba(255, 255, 255, .88);
                border: 1px solid #e0e6ee;
                border-radius: 11px;
                font-size: .7rem;
                font-weight: 650;
                text-decoration: none;
                box-shadow:
                    0 4px 12px rgba(55, 73, 107, .04);
                transition:
                    transform .18s ease,
                    color .18s ease,
                    background-color .18s ease,
                    border-color .18s ease,
                    box-shadow .18s ease;
            }

            .btn-back-service:hover {
                color: var(--meter-primary);
                background: var(--meter-primary-soft);
                border-color: rgba(79, 124, 255, .18);
                transform: translateX(-2px);
                box-shadow:
                    0 6px 15px rgba(79, 124, 255, .07);
            }


            /* =========================================================
               FORMULARIO
            ========================================================= */

            .meter-form-card {
                position: relative;
                overflow: hidden;
                background:
                    linear-gradient(
                        145deg,
                        rgba(255, 255, 255, .99),
                        rgba(251, 253, 255, .98)
                    );
                border: 1px solid var(--meter-border);
                border-radius: 22px;
                box-shadow: var(--meter-shadow);
                transition:
                    border-color .25s ease,
                    box-shadow .25s ease;
            }

            .meter-form-card:hover {
                border-color: rgba(79, 124, 255, .12);
                box-shadow: var(--meter-shadow-hover);
            }

            .meter-form-card::before {
                content: "";
                position: absolute;
                width: 180px;
                height: 180px;
                right: -100px;
                top: -115px;
                border-radius: 50%;
                background:
                    radial-gradient(
                        circle,
                        rgba(79, 124, 255, .055),
                        transparent 68%
                    );
                pointer-events: none;
            }

            .meter-form-body {
                position: relative;
                z-index: 2;
                padding: 1.5rem;
            }


            /* =========================================================
               HEADER DEL FORMULARIO
            ========================================================= */

            .form-section-header {
                display: flex;
                align-items: center;
                gap: .85rem;
                padding-bottom: 1.15rem;
                margin-bottom: 1.35rem;
                border-bottom: 1px solid var(--meter-border);
            }

            .form-section-icon {
                width: 43px;
                height: 43px;
                min-width: 43px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--meter-primary);
                background:
                    linear-gradient(
                        145deg,
                        var(--meter-primary-soft),
                        #f8fbff
                    );
                border: 1px solid rgba(79, 124, 255, .10);
                border-radius: 13px;
                box-shadow:
                    0 5px 14px rgba(79, 124, 255, .06);
                font-size: 1rem;
                transition:
                    transform .2s ease,
                    box-shadow .2s ease;
            }

            .meter-form-card:hover
            .form-section-icon {
                transform: translateY(-1px);
                box-shadow:
                    0 7px 17px rgba(79, 124, 255, .09);
            }

            .form-section-title {
                margin: 0 0 .15rem;
                color: var(--meter-dark);
                font-size: .96rem;
                font-weight: 750;
                letter-spacing: -.015em;
            }

            .form-section-subtitle {
                margin: 0;
                color: var(--meter-muted);
                font-size: .68rem;
                font-weight: 520;
            }

            .required-mark {
                color: var(--meter-red);
            }


            /* =========================================================
               CAMPOS
            ========================================================= */

            .meter-field {
                animation: meterFieldAppear .35s ease both;
            }

            .meter-field:nth-child(1) {
                animation-delay: .03s;
            }

            .meter-field:nth-child(2) {
                animation-delay: .06s;
            }

            .meter-field:nth-child(3) {
                animation-delay: .09s;
            }

            .meter-field:nth-child(4) {
                animation-delay: .12s;
            }

            .meter-field:nth-child(5) {
                animation-delay: .15s;
            }

            .meter-field:nth-child(6) {
                animation-delay: .18s;
            }

            @keyframes meterFieldAppear {
                from {
                    opacity: 0;
                    transform: translateY(5px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .meter-label {
                display: flex;
                align-items: center;
                margin-bottom: .42rem;
                color: #4a586d;
                font-size: .7rem;
                font-weight: 680;
            }

            .meter-input-group {
                position: relative;
                display: flex;
                align-items: stretch;
                width: 100%;
                border-radius: 12px;
                transition:
                    transform .18s ease,
                    box-shadow .2s ease;
            }

            .meter-input-group:focus-within {
                transform: translateY(-1px);
                box-shadow:
                    0 7px 18px rgba(79, 124, 255, .08);
            }

            .meter-input-icon {
                width: 43px;
                min-width: 43px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #8492a7;
                background: #f8fafc;
                border: 1px solid #e3e9f1;
                border-right: 0;
                border-radius: 12px 0 0 12px;
                font-size: .83rem;
                transition:
                    color .2s ease,
                    background-color .2s ease,
                    border-color .2s ease;
            }

            .meter-input-group:focus-within
            .meter-input-icon {
                color: var(--meter-primary);
                background: var(--meter-primary-soft);
                border-color: rgba(79, 124, 255, .42);
            }

            .meter-control {
                min-height: 43px;
                padding: .62rem .8rem;
                color: #39475c;
                background: #fbfcfe;
                border: 1px solid #e3e9f1;
                border-radius: 12px;
                outline: none;
                box-shadow: none !important;
                font-size: .76rem;
                font-weight: 540;
                transition:
                    color .2s ease,
                    background-color .2s ease,
                    border-color .2s ease;
            }

            .meter-input-group .meter-control {
                border-left: 0;
                border-radius: 0 12px 12px 0;
            }

            .meter-control:hover {
                background: #fff;
                border-color: #d8e0ea;
            }

            .meter-control:focus {
                color: #2f3c50;
                background: #fff;
                border-color: rgba(79, 124, 255, .5);
            }

            .meter-control::placeholder {
                color: #aab3c1;
                font-size: .72rem;
                font-weight: 450;
            }

            select.meter-control {
                cursor: pointer;
            }

            .serial-control {
                font-family:
                    ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    Monaco,
                    Consolas,
                    monospace;
                font-weight: 650;
                letter-spacing: .015em;
            }


            /* =========================================================
               FECHA
            ========================================================= */

            .date-group .meter-control {
                border-radius: 0;
                border-right: 0;
            }

            .btn-today {
                min-width: 48px;
                padding: 0 .7rem;
                color: var(--meter-primary);
                background: var(--meter-primary-soft);
                border: 1px solid #e3e9f1;
                border-left: 0;
                border-radius: 0 12px 12px 0;
                font-size: .66rem;
                font-weight: 700;
                transition:
                    color .18s ease,
                    background-color .18s ease,
                    border-color .18s ease;
            }

            .date-group:focus-within
            .btn-today {
                border-color: rgba(79, 124, 255, .42);
            }

            .btn-today:hover {
                color: #fff;
                background: var(--meter-primary);
                border-color: var(--meter-primary);
            }

            .btn-today:active {
                background: var(--meter-primary-dark);
            }


            /* =========================================================
               ESTADO
            ========================================================= */

            .status-icon {
                transition:
                    color .2s ease,
                    background-color .2s ease,
                    border-color .2s ease;
            }

            .status-active .status-icon {
                color: var(--meter-green);
                background: var(--meter-green-soft);
                border-color: rgba(58, 170, 131, .25);
            }

            .status-active .meter-control {
                color: #328c70;
                font-weight: 650;
            }

            .status-inactive .status-icon {
                color: var(--meter-red);
                background: var(--meter-red-soft);
                border-color: rgba(217, 108, 117, .27);
            }

            .status-inactive .meter-control {
                color: #bc6670;
                font-weight: 650;
            }


            /* =========================================================
               ACCIONES
            ========================================================= */

            .meter-form-actions {
                position: relative;
                z-index: 2;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: .65rem;
                padding: 1.05rem 1.5rem;
                background: rgba(250, 252, 255, .82);
                border-top: 1px solid var(--meter-border);
            }

            .btn-cancel-meter {
                min-height: 39px;
                padding: .55rem 1.05rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                color: #68768b;
                background: #fff;
                border: 1px solid #e0e6ee;
                border-radius: 11px;
                font-size: .72rem;
                font-weight: 650;
                text-decoration: none;
                transition:
                    transform .18s ease,
                    color .18s ease,
                    background-color .18s ease,
                    border-color .18s ease,
                    box-shadow .18s ease;
            }

            .btn-cancel-meter:hover {
                color: #3f4c60;
                background: #f8fafc;
                border-color: #d5dde7;
                transform: translateY(-1px);
                box-shadow:
                    0 5px 13px rgba(55, 73, 107, .06);
            }

            .btn-save-meter {
                min-height: 39px;
                padding: .55rem 1.15rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: .45rem;
                color: #fff;
                background:
                    linear-gradient(
                        135deg,
                        var(--meter-primary),
                        #5d88f7
                    );
                border: 1px solid var(--meter-primary);
                border-radius: 11px;
                font-size: .72rem;
                font-weight: 680;
                box-shadow:
                    0 7px 17px rgba(79, 124, 255, .18);
                transition:
                    transform .18s ease,
                    box-shadow .18s ease,
                    background .18s ease;
            }

            .btn-save-meter:hover {
                color: #fff;
                background:
                    linear-gradient(
                        135deg,
                        var(--meter-primary-dark),
                        var(--meter-primary)
                    );
                transform: translateY(-1px);
                box-shadow:
                    0 9px 21px rgba(79, 124, 255, .24);
            }

            .btn-save-meter:active,
            .btn-cancel-meter:active {
                transform: translateY(0);
            }


            /* =========================================================
               RESPONSIVE
            ========================================================= */

            @media (max-width: 767.98px) {

                .meter-page-header {
                    align-items: flex-start;
                    flex-direction: column;
                    padding: 1.1rem;
                }

                .meter-header-action,
                .btn-back-service {
                    width: 100%;
                }

                .meter-form-card {
                    border-radius: 18px;
                }

                .meter-form-body {
                    padding: 1.15rem;
                }

                .meter-form-actions {
                    padding: 1rem 1.15rem;
                }
            }

            @media (max-width: 575.98px) {

                .meter-page-title {
                    font-size: 1.08rem;
                }

                .form-section-header {
                    align-items: flex-start;
                }

                .form-section-icon {
                    width: 40px;
                    height: 40px;
                    min-width: 40px;
                }

                .meter-form-actions {
                    flex-direction: column-reverse;
                }

                .btn-cancel-meter,
                .btn-save-meter {
                    width: 100%;
                }
            }

            @media (prefers-reduced-motion: reduce) {

                .meter-page,
                .meter-page-header,
                .meter-form-card,
                .meter-field,
                .meter-input-group,
                .meter-input-icon,
                .meter-control,
                .btn-today,
                .btn-back-service,
                .btn-cancel-meter,
                .btn-save-meter {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>


        <div class="meter-page">

            <!-- ========================================== -->
            <!-- ENCABEZADO -->
            <!-- ========================================== -->

            <div class="meter-page-header">

                <div class="meter-header-content">

                    <div class="meter-title-row">

                        <h2 class="meter-page-title">
                            Registrar Medidor
                        </h2>

                        <span class="service-code-badge"
                              th:text="${servicio.codigoServicio}">
                            SRV-000000
                        </span>

                    </div>

                    <p class="meter-page-description">
                        Asocia un dispositivo de medición al servicio seleccionado.
                    </p>

                </div>


                <div class="meter-header-action">

                    <a class="btn-back-service"
                       th:href="@{/servicios/{id}(id=${servicio.idServicio})}">

                        <i class="bi bi-arrow-left"></i>

                        <span>
                            Volver al servicio
                        </span>

                    </a>

                </div>

            </div>


            <!-- ========================================== -->
            <!-- FORMULARIO -->
            <!-- ========================================== -->

            <form class="meter-form-card"
                  th:object="${medidor}"
                  th:action="@{/servicios/{id}/medidor(id=${servicio.idServicio})}"
                  method="post">


                <div class="meter-form-body">


                    <!-- ========================================== -->
                    <!-- HEADER -->
                    <!-- ========================================== -->

                    <div class="form-section-header">

                        <div class="form-section-icon">
                            <i class="bi bi-speedometer2"></i>
                        </div>

                        <div>

                            <h5 class="form-section-title">
                                Especificaciones del Dispositivo
                            </h5>

                            <p class="form-section-subtitle">
                                Los campos marcados con
                                (<span class="required-mark">*</span>)
                                son obligatorios
                            </p>

                        </div>

                    </div>


                    <!-- ========================================== -->
                    <!-- CAMPOS -->
                    <!-- ========================================== -->

                    <div class="row g-3">


                        <!-- NÚMERO MEDIDOR -->

                        <div class="col-md-4 meter-field">

                            <label for="numeroMedidor"
                                   class="meter-label">

                                Número de Serie / Código&nbsp;

                                <span class="required-mark">
                                    *
                                </span>

                            </label>


                            <div class="meter-input-group">

                                <span class="meter-input-icon">
                                    <i class="bi bi-cpu-fill"></i>
                                </span>

                                <input type="text"
                                       id="numeroMedidor"
                                       class="form-control meter-control serial-control"
                                       placeholder="Ej. MED-883920"
                                       th:field="*{numeroMedidor}"
                                       required>

                            </div>

                        </div>


                        <!-- MARCA -->

                        <div class="col-md-4 meter-field">

                            <label for="marca"
                                   class="meter-label">

                                Marca

                            </label>


                            <div class="meter-input-group">

                                <span class="meter-input-icon">
                                    <i class="bi bi-tag-fill"></i>
                                </span>

                                <input type="text"
                                       id="marca"
                                       class="form-control meter-control"
                                       placeholder="Ej. Elster / Zenner"
                                       th:field="*{marca}">

                            </div>

                        </div>


                        <!-- MODELO -->

                        <div class="col-md-4 meter-field">

                            <label for="modelo"
                                   class="meter-label">

                                Modelo

                            </label>


                            <div class="meter-input-group">

                                <span class="meter-input-icon">
                                    <i class="bi bi-box-seam-fill"></i>
                                </span>

                                <input type="text"
                                       id="modelo"
                                       class="form-control meter-control"
                                       placeholder="Ej. Volumétrico DN15"
                                       th:field="*{modelo}">

                            </div>

                        </div>


                        <!-- FECHA INSTALACIÓN -->

                        <div class="col-md-4 meter-field">

                            <label for="fechaInstalacion"
                                   class="meter-label">

                                Fecha de Instalación

                            </label>


                            <div class="meter-input-group date-group">

                                <span class="meter-input-icon">
                                    <i class="bi bi-calendar-event-fill"></i>
                                </span>

                                <input type="date"
                                       id="fechaInstalacion"
                                       class="form-control meter-control"
                                       th:field="*{fechaInstalacion}">

                                <button type="button"
                                        class="btn-today"
                                        id="btnSetToday"
                                        title="Establecer fecha de hoy">

                                    Hoy

                                </button>

                            </div>

                        </div>


                        <!-- LECTURA INICIAL -->

                        <div class="col-md-4 meter-field">

                            <label for="lecturaInicial"
                                   class="meter-label">

                                Lectura Inicial (m³)

                            </label>


                            <div class="meter-input-group">

                                <span class="meter-input-icon">
                                    <i class="bi bi-123"></i>
                                </span>

                                <input type="number"
                                       id="lecturaInicial"
                                       class="form-control meter-control serial-control"
                                       step="0.01"
                                       min="0"
                                       placeholder="0.00"
                                       th:field="*{lecturaInicial}">

                            </div>

                        </div>


                        <!-- ESTADO -->

                        <div class="col-md-4 meter-field">

                            <label for="estado"
                                   class="meter-label">

                                Estado Inicial

                            </label>


                            <div class="meter-input-group"
                                 id="estadoGroup">

                                <span class="meter-input-icon status-icon"
                                      id="estadoIconContainer">

                                    <i class="bi bi-check-circle-fill"
                                       id="estadoIcon"></i>

                                </span>

                                <select id="estado"
                                        class="form-select meter-control"
                                        th:field="*{estado}">

                                    <option value="ACTIVO">
                                        ACTIVO
                                    </option>

                                    <option value="INACTIVO">
                                        INACTIVO
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ========================================== -->
                <!-- ACCIONES -->
                <!-- ========================================== -->

                <div class="meter-form-actions">

                    <a class="btn-cancel-meter"
                       th:href="@{/servicios/{id}(id=${servicio.idServicio})}">

                        Cancelar

                    </a>


                    <button type="submit"
                            class="btn-save-meter">

                        <i class="bi bi-check2-circle"></i>

                        <span>
                            Guardar medidor
                        </span>

                    </button>

                </div>

            </form>

        </div>

    </section>

</main>


<div th:replace="~{fragments/layout :: scripts}"></div>


<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<!-- ========================================== -->
<!-- INTERACTIVIDAD -->
<!-- ========================================== -->

<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const selectEstado =
                document.getElementById(
                    "estado"
                );

            const estadoGroup =
                document.getElementById(
                    "estadoGroup"
                );

            const iconContainer =
                document.getElementById(
                    "estadoIconContainer"
                );

            const estadoIcon =
                document.getElementById(
                    "estadoIcon"
                );

            const fechaInstalacion =
                document.getElementById(
                    "fechaInstalacion"
                );

            const btnSetToday =
                document.getElementById(
                    "btnSetToday"
                );


            // =====================================================
            // ESTADO VISUAL
            // =====================================================

            function actualizarEstadoVisual() {

                if (
                    !selectEstado
                    || !estadoGroup
                    || !iconContainer
                    || !estadoIcon
                ) {

                    return;
                }


                const val =
                    selectEstado.value;


                estadoGroup.classList.remove(
                    "status-active",
                    "status-inactive"
                );


                estadoIcon.className =
                    "bi";


                if (
                    val === "ACTIVO"
                ) {

                    estadoGroup.classList.add(
                        "status-active"
                    );

                    estadoIcon.classList.add(
                        "bi-check-circle-fill"
                    );

                } else {

                    estadoGroup.classList.add(
                        "status-inactive"
                    );

                    estadoIcon.classList.add(
                        "bi-x-circle-fill"
                    );
                }
            }


            if (selectEstado) {

                selectEstado.addEventListener(
                    "change",
                    actualizarEstadoVisual
                );

                actualizarEstadoVisual();
            }


            // =====================================================
            // FECHA DE HOY
            // =====================================================

            if (
                btnSetToday
                && fechaInstalacion
            ) {

                btnSetToday.addEventListener(
                    "click",
                    function () {

                        const today =
                            new Date()
                                .toISOString()
                                .split("T")[0];


                        fechaInstalacion.value =
                            today;


                        fechaInstalacion.dispatchEvent(
                            new Event(
                                "change",
                                {
                                    bubbles: true
                                }
                            )
                        );
                    }
                );
            }

        }
    );

</script>

</body>

</html>
