<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Servicios')}"></head>

<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="app-main">

    <div th:replace="~{fragments/layout :: topbar('Servicios')}"></div>

    <section class="content px-3 px-lg-4 py-4">

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <style>
            :root {
                --service-primary: #4f7cff;
                --service-primary-dark: #416ce5;
                --service-primary-soft: #eef4ff;

                --service-cyan: #39b8c9;
                --service-cyan-soft: #ecfbfd;

                --service-green: #3aaa83;
                --service-green-soft: #edf9f5;

                --service-amber: #dca84f;
                --service-amber-soft: #fff8e8;

                --service-red: #d96c75;
                --service-red-soft: #fff0f2;

                --service-dark: #172033;
                --service-text: #536176;
                --service-muted: #8491a5;

                --service-border: #e8edf5;
                --service-bg: #f7f9fc;
                --service-surface: rgba(255, 255, 255, .97);

                --service-shadow:
                    0 10px 35px rgba(55, 73, 107, .07);

                --service-shadow-hover:
                    0 16px 42px rgba(55, 73, 107, .10);
            }

            body {
                background:
                    radial-gradient(
                        circle at 7% 4%,
                        rgba(79, 124, 255, .07),
                        transparent 26%
                    ),
                    radial-gradient(
                        circle at 94% 8%,
                        rgba(57, 184, 201, .06),
                        transparent 25%
                    ),
                    var(--service-bg) !important;
            }

            .service-form-page {
                max-width: 1180px;
                margin: 0 auto;
                animation: serviceFadeUp .45s ease both;
            }

            @keyframes serviceFadeUp {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* =========================================================
               CONTENEDOR
            ========================================================= */

            .service-form-card {
                position: relative;
                z-index: 1;
                overflow: visible !important;
                background:
                    linear-gradient(
                        145deg,
                        rgba(255, 255, 255, .99),
                        rgba(251, 253, 255, .98)
                    );
                border: 1px solid var(--service-border);
                border-radius: 22px;
                box-shadow: var(--service-shadow);
                transition:
                    border-color .25s ease,
                    box-shadow .25s ease;
            }

            .service-form-card:hover {
                border-color: rgba(79, 124, 255, .12);
                box-shadow: var(--service-shadow-hover);
            }

            .service-form-body {
                position: relative;
                z-index: 1;
                padding: 1.5rem;
                overflow: visible !important;
            }

            /* =========================================================
               HEADER
            ========================================================= */

            .form-section-header {
                display: flex;
                align-items: center;
                gap: .85rem;
                padding-bottom: 1.15rem;
                margin-bottom: 1.35rem;
                border-bottom: 1px solid var(--service-border);
            }

            .form-section-icon {
                width: 43px;
                height: 43px;
                min-width: 43px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--service-primary);
                background:
                    linear-gradient(
                        145deg,
                        var(--service-primary-soft),
                        #f8fbff
                    );
                border: 1px solid rgba(79, 124, 255, .10);
                border-radius: 13px;
                box-shadow:
                    0 5px 14px rgba(79, 124, 255, .06);
                font-size: 1rem;
            }

            .form-section-title {
                margin: 0 0 .15rem;
                color: var(--service-dark);
                font-size: .96rem;
                font-weight: 750;
                letter-spacing: -.015em;
            }

            .form-section-subtitle {
                margin: 0;
                color: var(--service-muted);
                font-size: .68rem;
                font-weight: 520;
            }

            .required-mark {
                color: var(--service-red);
            }

            /* =========================================================
               CAMPOS
            ========================================================= */

            /*
             * IMPORTANTE:
             * No usamos transform en la animación de los field-group.
             * El transform creaba stacking contexts independientes y hacía
             * que otros campos aparecieran encima del autocomplete.
             */
            .field-group {
                position: relative;
                z-index: 1;
                animation: fieldAppear .35s ease both;
            }

            /*
             * El segundo campo es INMUEBLE.
             * Lo colocamos deliberadamente sobre el resto de campos.
             */
            .field-group:nth-child(2) {
                z-index: 100;
                animation-delay: .04s;
            }

            .field-group:nth-child(1) {
                animation-delay: .02s;
            }

            .field-group:nth-child(3) {
                animation-delay: .06s;
            }

            .field-group:nth-child(4) {
                animation-delay: .08s;
            }

            .field-group:nth-child(5) {
                animation-delay: .10s;
            }

            .field-group:nth-child(6) {
                animation-delay: .12s;
            }

            @keyframes fieldAppear {
                from {
                    opacity: 0;
                }

                to {
                    opacity: 1;
                }
            }

            .service-label {
                display: flex;
                align-items: center;
                margin-bottom: .42rem;
                color: #4a586d;
                font-size: .7rem;
                font-weight: 680;
            }

            .service-input-group {
                position: relative;
                display: flex;
                align-items: stretch;
                width: 100%;
                border-radius: 12px;
                transition:
                    transform .18s ease,
                    box-shadow .2s ease;
            }

            .service-input-group:focus-within {
                transform: translateY(-1px);
                box-shadow:
                    0 7px 18px rgba(79, 124, 255, .08);
            }

            .service-input-icon {
                width: 43px;
                min-width: 43px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #8492a7;
                background: #f8fafc;
                border: 1px solid #e3e9f1;
                border-right: 0;
                border-radius: 12px 0 0 12px;
                font-size: .83rem;
                transition:
                    color .2s ease,
                    background-color .2s ease,
                    border-color .2s ease;
            }

            .service-input-group:focus-within
            .service-input-icon {
                color: var(--service-primary);
                background: var(--service-primary-soft);
                border-color: rgba(79, 124, 255, .42);
            }

            .service-control {
                min-height: 43px;
                padding: .62rem .8rem;
                color: #39475c;
                background: #fbfcfe;
                border: 1px solid #e3e9f1;
                border-radius: 12px;
                outline: none;
                box-shadow: none !important;
                font-size: .76rem;
                font-weight: 540;
                transition:
                    color .2s ease,
                    background-color .2s ease,
                    border-color .2s ease,
                    box-shadow .2s ease;
            }

            .service-input-group .service-control {
                border-left: 0;
                border-radius: 0 12px 12px 0;
            }

            .service-control:hover {
                background: #fff;
                border-color: #d8e0ea;
            }

            .service-control:focus {
                color: #2f3c50;
                background: #fff;
                border-color: rgba(79, 124, 255, .5);
                box-shadow:
                    0 0 0 3px rgba(79, 124, 255, .07) !important;
            }

            .service-input-group
            .service-control:focus {
                box-shadow: none !important;
            }

            .service-control::placeholder {
                color: #aab3c1;
                font-size: .72rem;
                font-weight: 450;
            }

            select.service-control {
                cursor: pointer;
            }

            textarea.service-control {
                min-height: 100px;
                resize: vertical;
                line-height: 1.55;
            }

            /* =========================================================
               AUTOCOMPLETE
            ========================================================= */

            .property-search-wrapper {
                position: relative;
                z-index: 200;
                overflow: visible !important;
            }

            .autocomplete-results {
                position: absolute !important;
                top: calc(100% + 7px);
                left: 0;
                right: 0;
                z-index: 9999 !important;
                width: 100%;
                max-height: 320px;
                overflow-x: hidden;
                overflow-y: auto;
                padding: .35rem;
                background: rgba(255, 255, 255, .99);
                border: 1px solid #e3e9f1;
                border-radius: 13px;
                box-shadow:
                    0 18px 45px rgba(40, 55, 85, .18),
                    0 4px 12px rgba(40, 55, 85, .06);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                isolation: isolate;
            }

            .autocomplete-results::-webkit-scrollbar {
                width: 6px;
            }

            .autocomplete-results::-webkit-scrollbar-thumb {
                background: #d7dee8;
                border-radius: 20px;
            }

            .autocomplete-results
            .list-group-item {
                position: relative;
                z-index: 1;
                margin: 0;
                padding: .7rem .75rem !important;
                color: var(--service-text);
                background: transparent;
                border: 0;
                border-radius: 9px !important;
                font-size: .7rem;
                transition:
                    background-color .16s ease,
                    transform .16s ease;
            }

            .autocomplete-results
            .list-group-item-action:hover {
                background: var(--service-primary-soft);
                transform: translateX(2px);
            }

            .autocomplete-results
            .fw-semibold {
                color: #354157 !important;
                font-size: .71rem;
                font-weight: 680 !important;
            }

            .autocomplete-results small {
                display: block;
                margin-top: .1rem;
                color: #909cad !important;
                font-size: .62rem;
            }

            .search-help {
                display: flex;
                align-items: flex-start;
                gap: .35rem;
                margin-top: .5rem;
                color: #96a1b1;
                font-size: .62rem;
                line-height: 1.45;
            }

            .search-help i {
                margin-top: .08rem;
                color: #a1adbd;
            }

            /* =========================================================
               INMUEBLE SELECCIONADO
            ========================================================= */

            .selected-property {
                position: relative;
                overflow: hidden;
                padding: .8rem .9rem;
                margin-top: .75rem;
                background:
                    linear-gradient(
                        135deg,
                        var(--service-primary-soft),
                        #f7faff
                    );
                border: 1px solid rgba(79, 124, 255, .12);
                border-radius: 12px;
                animation: selectedAppear .22s ease both;
            }

            @keyframes selectedAppear {
                from {
                    opacity: 0;
                    transform: translateY(-5px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .selected-property::after {
                content: "";
                position: absolute;
                width: 75px;
                height: 75px;
                right: -35px;
                bottom: -45px;
                border-radius: 50%;
                background: rgba(79, 124, 255, .045);
                pointer-events: none;
            }

            .selected-property-content {
                position: relative;
                z-index: 2;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: .75rem;
            }

            .selected-property-info {
                display: flex;
                align-items: center;
                gap: .7rem;
                min-width: 0;
            }

            .selected-property-icon {
                width: 38px;
                height: 38px;
                min-width: 38px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--service-primary);
                background: #fff;
                border: 1px solid rgba(79, 124, 255, .12);
                border-radius: 11px;
                font-size: .82rem;
                box-shadow:
                    0 4px 12px rgba(79, 124, 255, .07);
            }

            .selected-property-address {
                overflow: hidden;
                color: #344157;
                font-size: .72rem;
                font-weight: 700;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .selected-property-detail {
                display: block;
                margin-top: .08rem;
                color: #8390a3;
                font-size: .62rem;
                white-space: nowrap;
            }

            .remove-property {
                width: 31px;
                height: 31px;
                min-width: 31px;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #bc6670;
                background: rgba(255, 255, 255, .8);
                border: 1px solid rgba(217, 108, 117, .18);
                border-radius: 9px;
                font-size: .68rem;
                transition:
                    color .18s ease,
                    background-color .18s ease,
                    border-color .18s ease,
                    transform .18s ease;
            }

            .remove-property:hover {
                color: #fff;
                background: var(--service-red);
                border-color: var(--service-red);
                transform: rotate(4deg);
            }

            /* =========================================================
               ESTADO
            ========================================================= */

            .status-icon {
                transition:
                    color .2s ease,
                    background-color .2s ease,
                    border-color .2s ease;
            }

            .status-active .status-icon {
                color: var(--service-green);
                background: var(--service-green-soft);
                border-color: rgba(58, 170, 131, .25);
            }

            .status-active .service-control {
                color: #328c70;
                font-weight: 650;
            }

            .status-suspended .status-icon {
                color: var(--service-amber);
                background: var(--service-amber-soft);
                border-color: rgba(220, 168, 79, .3);
            }

            .status-suspended .service-control {
                color: #ad8035;
                font-weight: 650;
            }

            .status-inactive .status-icon {
                color: var(--service-red);
                background: var(--service-red-soft);
                border-color: rgba(217, 108, 117, .27);
            }

            .status-inactive .service-control {
                color: #bc6670;
                font-weight: 650;
            }

            /* =========================================================
               OBSERVACIONES
            ========================================================= */

            .observation-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                margin-bottom: .42rem;
            }

            .character-counter {
                color: #a0abba;
                font-size: .61rem;
                font-weight: 560;
                white-space: nowrap;
            }

            .observation-control {
                width: 100%;
                min-height: 100px;
                padding: .75rem .85rem;
                color: #39475c;
                background: #fbfcfe;
                border: 1px solid #e3e9f1;
                border-radius: 12px;
                outline: none;
                box-shadow: none;
                font-size: .76rem;
                font-weight: 520;
                line-height: 1.55;
                resize: vertical;
                transition:
                    transform .18s ease,
                    background-color .2s ease,
                    border-color .2s ease,
                    box-shadow .2s ease;
            }

            .observation-control:hover {
                background: #fff;
                border-color: #d8e0ea;
            }

            .observation-control:focus {
                background: #fff;
                border-color: rgba(79, 124, 255, .5);
                box-shadow:
                    0 0 0 3px rgba(79, 124, 255, .07);
                transform: translateY(-1px);
            }

            .observation-control::placeholder {
                color: #aab3c1;
                font-size: .72rem;
            }

            /* =========================================================
               ERROR
            ========================================================= */

            .service-control.is-invalid {
                border-color: rgba(217, 108, 117, .7);
                background: #fffafa;
            }

            .service-input-group:has(.is-invalid)
            .service-input-icon {
                color: var(--service-red);
                background: var(--service-red-soft);
                border-color: rgba(217, 108, 117, .7);
            }

            .property-error {
                margin-top: .42rem;
                color: #c35d67;
                font-size: .64rem;
                font-weight: 600;
            }

            /* =========================================================
               ACCIONES
            ========================================================= */

            .form-actions {
                position: relative;
                z-index: 1;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: .65rem;
                padding: 1.05rem 1.5rem;
                background: rgba(250, 252, 255, .82);
                border-top: 1px solid var(--service-border);
                border-radius: 0 0 22px 22px;
            }

            .btn-cancel-service {
                min-height: 39px;
                padding: .55rem 1.05rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                color: #68768b;
                background: #fff;
                border: 1px solid #e0e6ee;
                border-radius: 11px;
                font-size: .72rem;
                font-weight: 650;
                text-decoration: none;
                transition:
                    transform .18s ease,
                    color .18s ease,
                    background-color .18s ease,
                    border-color .18s ease,
                    box-shadow .18s ease;
            }

            .btn-cancel-service:hover {
                color: #3f4c60;
                background: #f8fafc;
                border-color: #d5dde7;
                transform: translateY(-1px);
                box-shadow:
                    0 5px 13px rgba(55, 73, 107, .06);
            }

            .btn-save-service {
                min-height: 39px;
                padding: .55rem 1.15rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: .45rem;
                color: #fff;
                background:
                    linear-gradient(
                        135deg,
                        var(--service-primary),
                        #5d88f7
                    );
                border: 1px solid var(--service-primary);
                border-radius: 11px;
                font-size: .72rem;
                font-weight: 680;
                box-shadow:
                    0 7px 17px rgba(79, 124, 255, .18);
                transition:
                    transform .18s ease,
                    box-shadow .18s ease,
                    background .18s ease;
            }

            .btn-save-service:hover {
                color: #fff;
                background:
                    linear-gradient(
                        135deg,
                        var(--service-primary-dark),
                        var(--service-primary)
                    );
                transform: translateY(-1px);
                box-shadow:
                    0 9px 21px rgba(79, 124, 255, .24);
            }

            .btn-save-service:active,
            .btn-cancel-service:active {
                transform: translateY(0);
            }

            /* =========================================================
               RESPONSIVE
            ========================================================= */

            @media (max-width: 767.98px) {
                .service-form-card {
                    border-radius: 18px;
                }

                .service-form-body {
                    padding: 1.15rem;
                }

                .form-actions {
                    padding: 1rem 1.15rem;
                    border-radius: 0 0 18px 18px;
                }
            }

            @media (max-width: 575.98px) {
                .form-section-header {
                    align-items: flex-start;
                }

                .form-section-icon {
                    width: 40px;
                    height: 40px;
                    min-width: 40px;
                }

                .selected-property-content {
                    align-items: flex-start;
                }

                .selected-property-detail {
                    white-space: normal;
                }

                .observation-header {
                    align-items: flex-start;
                }

                .form-actions {
                    flex-direction: column-reverse;
                }

                .btn-cancel-service,
                .btn-save-service {
                    width: 100%;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .service-form-page,
                .service-form-card,
                .field-group,
                .service-input-group,
                .service-input-icon,
                .service-control,
                .selected-property,
                .remove-property,
                .observation-control,
                .btn-cancel-service,
                .btn-save-service,
                .autocomplete-results .list-group-item {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>


        <div class="service-form-page">

            <form id="formServicio"
                  class="service-form-card"
                  th:object="${servicio}"
                  th:action="@{${servicio.idServicio == null ? '/servicios/guardar' : '/servicios/' + servicio.idServicio + '/actualizar'}}"
                  method="post">


                <div class="service-form-body">

                    <div class="form-section-header">

                        <div class="form-section-icon">
                            <i class="bi bi-droplet-fill"></i>
                        </div>

                        <div>

                            <h5 class="form-section-title">
                                Información Técnica del Servicio
                            </h5>

                            <p class="form-section-subtitle">
                                Los campos marcados con
                                (<span class="required-mark">*</span>)
                                son obligatorios
                            </p>

                        </div>

                    </div>


                    <div class="row g-3">


                        <!-- CÓDIGO -->

                        <div class="col-md-4 field-group">

                            <label class="service-label">
                                Código&nbsp;
                                <span class="required-mark">*</span>
                            </label>

                            <div class="service-input-group">

                                <span class="service-input-icon">
                                    <i class="bi bi-qr-code"></i>
                                </span>

                                <input class="form-control service-control"
                                       type="text"
                                       th:field="*{codigoServicio}"
                                       placeholder="Ej. SRV-001"
                                       required>

                            </div>

                        </div>


                        <!-- INMUEBLE -->

                        <div class="col-md-4 field-group">

                            <label class="service-label">
                                Inmueble&nbsp;
                                <span class="required-mark">*</span>
                            </label>

                            <div class="property-search-wrapper">

                                <div class="service-input-group">

                                    <span class="service-input-icon">
                                        <i class="bi bi-search"></i>
                                    </span>

                                    <input type="text"
                                           id="buscarInmueble"
                                           class="form-control service-control"
                                           autocomplete="off"
                                           placeholder="Buscar dirección, código, sector...">

                                </div>

                                <input type="hidden"
                                       id="idInmueble"
                                       th:field="*{inmueble.idInmueble}">

                                <div id="resultadosInmuebles"
                                     class="list-group autocomplete-results d-none">
                                </div>

                            </div>


                            <div class="search-help">

                                <i class="bi bi-info-circle"></i>

                                <span>
                                    Puede buscar por dirección, código,
                                    sector, manzana o lote.
                                </span>

                            </div>


                            <div id="inmuebleSeleccionado"
                                 class="selected-property"
                                 th:classappend="${servicio.inmueble == null || servicio.inmueble.idInmueble == null} ? ' d-none'">

                                <div class="selected-property-content">

                                    <div class="selected-property-info">

                                        <div class="selected-property-icon">
                                            <i class="bi bi-house-check-fill"></i>
                                        </div>

                                        <div class="overflow-hidden">

                                            <div class="selected-property-address"
                                                 id="direccionInmuebleSeleccionado"
                                                 th:text="${servicio.inmueble != null ? servicio.inmueble.direccion : ''}">
                                            </div>

                                            <small class="selected-property-detail">

                                                <span id="codigoInmuebleSeleccionado"
                                                      th:text="${servicio.inmueble != null ? servicio.inmueble.codigoInmueble : ''}">
                                                </span>

                                                <span id="sectorInmuebleSeleccionado"
                                                      th:if="${servicio.inmueble != null && servicio.inmueble.sector != null}"
                                                      th:text="${' · ' + servicio.inmueble.sector}">
                                                </span>

                                            </small>

                                        </div>

                                    </div>

                                    <button type="button"
                                            id="quitarInmueble"
                                            class="remove-property"
                                            title="Cambiar inmueble">

                                        <i class="bi bi-x-lg"></i>

                                    </button>

                                </div>

                            </div>


                            <div id="errorInmueble"
                                 class="property-error d-none">

                                Debe buscar y seleccionar un inmueble.

                            </div>

                        </div>


                        <!-- TIPO -->

                        <div class="col-md-4 field-group">

                            <label class="service-label">
                                Tipo de servicio&nbsp;
                                <span class="required-mark">*</span>
                            </label>

                            <div class="service-input-group">

                                <span class="service-input-icon">
                                    <i class="bi bi-sliders"></i>
                                </span>

                                <select class="form-select service-control"
                                        th:field="*{tipoServicio.idTipoServicio}"
                                        required>

                                    <option value="">
                                        Seleccione tipo…
                                    </option>

                                    <option th:each="t : ${tipos}"
                                            th:value="${t.idTipoServicio}"
                                            th:text="${t.nombre}">
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- FECHA -->

                        <div class="col-md-6 field-group">

                            <label class="service-label">
                                Fecha de Alta
                            </label>

                            <div class="service-input-group">

                                <span class="service-input-icon">
                                    <i class="bi bi-calendar-event"></i>
                                </span>

                                <input class="form-control service-control"
                                       type="date"
                                       id="fechaAlta"
                                       th:field="*{fechaAlta}">

                            </div>

                        </div>


                        <!-- ESTADO -->

                        <div class="col-md-6 field-group">

                            <label class="service-label">
                                Estado del Servicio
                            </label>

                            <div class="service-input-group"
                                 id="estadoGroup">

                                <span class="service-input-icon status-icon"
                                      id="estadoIconContainer">

                                    <i class="bi bi-check-circle-fill"
                                       id="estadoIcon"></i>

                                </span>

                                <select class="form-select service-control"
                                        id="selectEstado"
                                        th:field="*{estado}">

                                    <option value="ACTIVO">
                                        Activo
                                    </option>

                                    <option value="SUSPENDIDO">
                                        Suspendido
                                    </option>

                                    <option value="INACTIVO">
                                        Inactivo
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- OBSERVACIONES -->

                        <div class="col-12 field-group">

                            <div class="observation-header">

                                <label class="service-label mb-0">
                                    Observaciones y Notas
                                </label>

                                <span class="character-counter"
                                      id="charCounter">
                                    0 / 500 caracteres
                                </span>

                            </div>

                            <textarea class="observation-control"
                                      id="inputObservaciones"
                                      th:field="*{observaciones}"
                                      rows="4"
                                      maxlength="500"
                                      placeholder="Ingrese detalles relevantes, incidencias técnicas o notas sobre la conexión…"></textarea>

                        </div>

                    </div>

                </div>


                <div class="form-actions">

                    <a class="btn-cancel-service"
                       th:href="@{/servicios}">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn-save-service">

                        <i class="bi bi-check2-circle"></i>

                        <span th:text="${servicio.idServicio == null ? 'Guardar servicio' : 'Actualizar servicio'}">
                            Guardar servicio
                        </span>

                    </button>

                </div>

            </form>

        </div>

    </section>

</main>


<div th:replace="~{fragments/layout :: scripts}"></div>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<script th:inline="javascript">

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const formulario =
                document.getElementById(
                    "formServicio"
                );

            const buscador =
                document.getElementById(
                    "buscarInmueble"
                );

            const idInmueble =
                document.getElementById(
                    "idInmueble"
                );

            const resultados =
                document.getElementById(
                    "resultadosInmuebles"
                );

            const seleccionado =
                document.getElementById(
                    "inmuebleSeleccionado"
                );

            const direccionSeleccionada =
                document.getElementById(
                    "direccionInmuebleSeleccionado"
                );

            const codigoSeleccionado =
                document.getElementById(
                    "codigoInmuebleSeleccionado"
                );

            const sectorSeleccionado =
                document.getElementById(
                    "sectorInmuebleSeleccionado"
                );

            const quitar =
                document.getElementById(
                    "quitarInmueble"
                );

            const error =
                document.getElementById(
                    "errorInmueble"
                );

            const selectEstado =
                document.getElementById(
                    "selectEstado"
                );

            const estadoGroup =
                document.getElementById(
                    "estadoGroup"
                );

            const iconContainer =
                document.getElementById(
                    "estadoIconContainer"
                );

            const estadoIcon =
                document.getElementById(
                    "estadoIcon"
                );

            const txtObservaciones =
                document.getElementById(
                    "inputObservaciones"
                );

            const charCounter =
                document.getElementById(
                    "charCounter"
                );

            const fechaAlta =
                document.getElementById(
                    "fechaAlta"
                );


            const buscarUrl =
                /*[[@{/servicios/buscar-inmuebles}]]*/
                "/servicios/buscar-inmuebles";


            if (
                fechaAlta
                && !fechaAlta.value
            ) {

                const hoy =
                    new Date();

                const anio =
                    hoy.getFullYear();

                const mes =
                    String(
                        hoy.getMonth() + 1
                    ).padStart(
                        2,
                        "0"
                    );

                const dia =
                    String(
                        hoy.getDate()
                    ).padStart(
                        2,
                        "0"
                    );

                fechaAlta.value =
                    `${anio}-${mes}-${dia}`;
            }


            let temporizador;
            let controlador;


            buscador.addEventListener(
                "input",
                function () {

                    idInmueble.value = "";

                    seleccionado.classList.add(
                        "d-none"
                    );

                    buscador.classList.remove(
                        "is-invalid"
                    );

                    error.classList.add(
                        "d-none"
                    );


                    const texto =
                        buscador.value.trim();


                    clearTimeout(
                        temporizador
                    );


                    if (texto.length < 2) {

                        ocultarResultados();

                        return;
                    }


                    temporizador =
                        setTimeout(
                            () => buscarInmuebles(texto),
                            250
                        );
                }
            );


            async function buscarInmuebles(
                texto
            ) {

                if (controlador) {
                    controlador.abort();
                }


                controlador =
                    new AbortController();


                resultados.innerHTML = `

                    <div class="list-group-item py-3 text-muted">

                        <span class="spinner-border
                                     spinner-border-sm
                                     me-2"></span>

                        Buscando inmuebles...

                    </div>

                `;


                resultados.classList.remove(
                    "d-none"
                );


                try {

                    const response =
                        await fetch(

                            `${buscarUrl}?q=${
                                encodeURIComponent(texto)
                            }`,

                            {
                                signal:
                                    controlador.signal
                            }

                        );


                    if (!response.ok) {

                        throw new Error(
                            "Error al buscar inmuebles."
                        );
                    }


                    const datos =
                        await response.json();


                    if (
                        buscador.value.trim()
                        !== texto
                    ) {

                        return;
                    }


                    mostrarResultados(
                        datos
                    );

                } catch (e) {

                    if (
                        e.name === "AbortError"
                    ) {

                        return;
                    }


                    resultados.innerHTML = `

                        <div class="list-group-item
                                    py-3 text-danger">

                            <i class="bi
                                      bi-exclamation-circle
                                      me-2"></i>

                            No fue posible buscar
                            los inmuebles.

                        </div>

                    `;
                }
            }


            function mostrarResultados(
                datos
            ) {

                resultados.innerHTML = "";


                if (
                    !datos
                    || datos.length === 0
                ) {

                    resultados.innerHTML = `

                        <div class="list-group-item
                                    py-3 text-muted">

                            <i class="bi bi-search me-2"></i>

                            No se encontraron
                            inmuebles activos.

                        </div>

                    `;


                    resultados.classList.remove(
                        "d-none"
                    );

                    return;
                }


                datos.forEach(
                    i => {

                        const boton =
                            document.createElement(
                                "button"
                            );


                        boton.type =
                            "button";


                        boton.className =
                            "list-group-item "
                            + "list-group-item-action "
                            + "py-3";


                        const fila =
                            document.createElement(
                                "div"
                            );


                        fila.className =
                            "d-flex "
                            + "justify-content-between "
                            + "align-items-center "
                            + "gap-3";


                        const izquierda =
                            document.createElement(
                                "div"
                            );


                        const direccion =
                            document.createElement(
                                "div"
                            );


                        direccion.className =
                            "fw-semibold text-dark";


                        direccion.textContent =
                            i.direccion
                            || "Sin dirección";


                        const detalle =
                            document.createElement(
                                "small"
                            );


                        detalle.className =
                            "text-muted";


                        const partes = [];


                        if (i.codigo) {

                            partes.push(
                                i.codigo
                            );
                        }


                        if (i.sector) {

                            partes.push(
                                `Sector: ${i.sector}`
                            );
                        }


                        if (i.manzana) {

                            partes.push(
                                `Mz. ${i.manzana}`
                            );
                        }


                        if (i.lote) {

                            partes.push(
                                `Lt. ${i.lote}`
                            );
                        }


                        detalle.textContent =
                            partes.join(
                                " · "
                            );


                        izquierda.appendChild(
                            direccion
                        );


                        izquierda.appendChild(
                            detalle
                        );


                        const icono =
                            document.createElement(
                                "i"
                            );


                        icono.className =
                            "bi bi-chevron-right "
                            + "text-muted";


                        fila.appendChild(
                            izquierda
                        );


                        fila.appendChild(
                            icono
                        );


                        boton.appendChild(
                            fila
                        );


                        boton.addEventListener(
                            "click",
                            function () {

                                seleccionarInmueble(
                                    i
                                );
                            }
                        );


                        resultados.appendChild(
                            boton
                        );
                    }
                );


                resultados.classList.remove(
                    "d-none"
                );
            }


            function seleccionarInmueble(
                inmueble
            ) {

                idInmueble.value =
                    inmueble.idInmueble;


                buscador.value =
                    inmueble.direccion
                    || inmueble.codigo
                    || "";


                direccionSeleccionada.textContent =
                    inmueble.direccion
                    || "Sin dirección";


                codigoSeleccionado.textContent =
                    inmueble.codigo
                    || "";


                sectorSeleccionado.textContent =
                    inmueble.sector
                        ? ` · ${inmueble.sector}`
                        : "";


                seleccionado.classList.remove(
                    "d-none"
                );


                buscador.classList.remove(
                    "is-invalid"
                );


                error.classList.add(
                    "d-none"
                );


                ocultarResultados();
            }


            quitar.addEventListener(
                "click",
                function () {

                    idInmueble.value = "";

                    buscador.value = "";

                    direccionSeleccionada.textContent = "";

                    codigoSeleccionado.textContent = "";

                    sectorSeleccionado.textContent = "";

                    seleccionado.classList.add(
                        "d-none"
                    );

                    ocultarResultados();

                    buscador.focus();
                }
            );


            document.addEventListener(
                "click",
                function (event) {

                    if (
                        !buscador.contains(
                            event.target
                        )
                        &&
                        !resultados.contains(
                            event.target
                        )
                    ) {

                        ocultarResultados();
                    }
                }
            );


            function ocultarResultados() {

                resultados.classList.add(
                    "d-none"
                );
            }


            formulario.addEventListener(
                "submit",
                function (event) {

                    if (
                        !idInmueble.value
                    ) {

                        event.preventDefault();

                        buscador.classList.add(
                            "is-invalid"
                        );

                        error.classList.remove(
                            "d-none"
                        );

                        buscador.focus();

                        return;
                    }


                    buscador.classList.remove(
                        "is-invalid"
                    );

                    error.classList.add(
                        "d-none"
                    );
                }
            );


            function actualizarEstadoVisual() {

                if (
                    !selectEstado
                    || !estadoGroup
                    || !iconContainer
                    || !estadoIcon
                ) {

                    return;
                }


                const val =
                    selectEstado.value;


                estadoGroup.classList.remove(
                    "status-active",
                    "status-suspended",
                    "status-inactive"
                );


                estadoIcon.className =
                    "bi";


                if (
                    val === "ACTIVO"
                ) {

                    estadoGroup.classList.add(
                        "status-active"
                    );

                    estadoIcon.classList.add(
                        "bi-check-circle-fill"
                    );

                } else if (
                    val === "SUSPENDIDO"
                ) {

                    estadoGroup.classList.add(
                        "status-suspended"
                    );

                    estadoIcon.classList.add(
                        "bi-exclamation-triangle-fill"
                    );

                } else {

                    estadoGroup.classList.add(
                        "status-inactive"
                    );

                    estadoIcon.classList.add(
                        "bi-x-circle-fill"
                    );
                }
            }


            if (selectEstado) {

                selectEstado.addEventListener(
                    "change",
                    actualizarEstadoVisual
                );

                actualizarEstadoVisual();
            }


            if (
                txtObservaciones
                && charCounter
            ) {

                function actualizarContador() {

                    const cantidad =
                        txtObservaciones
                            .value
                            .length;


                    charCounter.textContent =
                        `${cantidad} / 500 caracteres`;
                }


                txtObservaciones.addEventListener(
                    "input",
                    actualizarContador
                );


                actualizarContador();
            }

        }
    );

</script>

</body>
</html>
