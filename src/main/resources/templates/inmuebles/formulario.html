<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Inmuebles')}">
</head>

<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="app-main">

    <div th:replace="~{fragments/layout :: topbar('Inmuebles')}"></div>

    <section class="content px-3 px-lg-4 py-4">

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <style>
            :root {
                --property-primary: #4f7cff;
                --property-primary-dark: #416ce5;
                --property-primary-soft: #eef4ff;

                --property-cyan: #39b8c9;
                --property-cyan-soft: #ecfbfd;

                --property-green: #3aaa83;
                --property-green-soft: #edf9f5;

                --property-red: #d96c75;

                --property-dark: #172033;
                --property-text: #536176;
                --property-muted: #8491a5;

                --property-border: #e8edf5;
                --property-bg: #f7f9fc;
                --property-surface: rgba(255, 255, 255, .97);

                --property-shadow: 0 10px 35px rgba(55, 73, 107, .07);
                --property-shadow-hover: 0 16px 42px rgba(55, 73, 107, .10);
            }

            body {
                background:
                    radial-gradient(
                        circle at 7% 4%,
                        rgba(79, 124, 255, .07),
                        transparent 26%
                    ),
                    radial-gradient(
                        circle at 94% 8%,
                        rgba(57, 184, 201, .06),
                        transparent 25%
                    ),
                    var(--property-bg) !important;
            }

            .property-form-page {
                animation: propertyFadeUp .45s ease both;
            }

            @keyframes propertyFadeUp {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* =========================================================
               CONTENEDOR PRINCIPAL
            ========================================================= */

            .property-form-card {
                position: relative;
                overflow: hidden;
                max-width: 1180px;
                margin: 0 auto;
                background:
                    linear-gradient(
                        145deg,
                        rgba(255, 255, 255, .99),
                        rgba(251, 253, 255, .98)
                    );
                border: 1px solid var(--property-border);
                border-radius: 22px;
                box-shadow: var(--property-shadow);
                transition:
                    box-shadow .25s ease,
                    border-color .25s ease;
            }

            .property-form-card:hover {
                border-color: rgba(79, 124, 255, .12);
                box-shadow: var(--property-shadow-hover);
            }

            .property-form-card::before {
                content: "";
                position: absolute;
                width: 210px;
                height: 210px;
                right: -95px;
                top: -115px;
                border-radius: 50%;
                background: rgba(79, 124, 255, .045);
                pointer-events: none;
            }

            .property-form-card::after {
                content: "";
                position: absolute;
                width: 120px;
                height: 120px;
                left: -75px;
                bottom: -75px;
                border-radius: 50%;
                background: rgba(57, 184, 201, .04);
                pointer-events: none;
            }

            .property-form-content {
                position: relative;
                z-index: 2;
                padding: 1.5rem;
            }

            /* =========================================================
               ENCABEZADO
            ========================================================= */

            .form-section-header {
                display: flex;
                align-items: center;
                gap: .85rem;
                padding-bottom: 1.15rem;
                margin-bottom: 1.35rem;
                border-bottom: 1px solid var(--property-border);
            }

            .form-section-icon {
                width: 43px;
                height: 43px;
                min-width: 43px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--property-primary);
                background:
                    linear-gradient(
                        145deg,
                        var(--property-primary-soft),
                        #f8fbff
                    );
                border: 1px solid rgba(79, 124, 255, .1);
                border-radius: 13px;
                box-shadow: 0 5px 14px rgba(79, 124, 255, .06);
                font-size: 1rem;
            }

            .form-section-title {
                margin: 0 0 .15rem;
                color: var(--property-dark);
                font-size: .96rem;
                font-weight: 750;
                letter-spacing: -.015em;
            }

            .form-section-subtitle {
                margin: 0;
                color: var(--property-muted);
                font-size: .68rem;
                font-weight: 520;
            }

            .required-mark {
                color: var(--property-red);
            }

            /* =========================================================
               CAMPOS
            ========================================================= */

            .field-group {
                position: relative;
            }

            .property-label {
                display: flex;
                align-items: center;
                margin-bottom: .42rem;
                color: #4a586d;
                font-size: .7rem;
                font-weight: 680;
            }

            .property-input-group {
                position: relative;
                display: flex;
                align-items: stretch;
                width: 100%;
                border-radius: 12px;
                transition:
                    transform .18s ease,
                    box-shadow .2s ease;
            }

            .property-input-group:focus-within {
                transform: translateY(-1px);
                box-shadow: 0 7px 18px rgba(79, 124, 255, .08);
            }

            .property-input-icon {
                width: 43px;
                min-width: 43px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #8492a7;
                background: #f8fafc;
                border: 1px solid #e3e9f1;
                border-right: 0;
                border-radius: 12px 0 0 12px;
                font-size: .83rem;
                transition:
                    color .2s ease,
                    background-color .2s ease,
                    border-color .2s ease;
            }

            .property-input-group:focus-within .property-input-icon {
                color: var(--property-primary);
                background: var(--property-primary-soft);
                border-color: rgba(79, 124, 255, .42);
            }

            .property-control {
                min-height: 43px;
                padding: .62rem .8rem;
                color: #39475c;
                background: #fbfcfe;
                border: 1px solid #e3e9f1;
                border-radius: 12px;
                outline: none;
                box-shadow: none !important;
                font-size: .76rem;
                font-weight: 540;
                transition:
                    background-color .2s ease,
                    border-color .2s ease,
                    box-shadow .2s ease;
            }

            .property-input-group .property-control {
                border-left: 0;
                border-radius: 0 12px 12px 0;
            }

            .property-control:hover {
                background: #fff;
                border-color: #d8e0ea;
            }

            .property-control:focus {
                color: #2f3c50;
                background: #fff;
                border-color: rgba(79, 124, 255, .5);
                box-shadow: 0 0 0 3px rgba(79, 124, 255, .07) !important;
            }

            .property-input-group .property-control:focus {
                box-shadow: none !important;
            }

            .property-control::placeholder {
                color: #aab3c1;
                font-size: .72rem;
                font-weight: 450;
            }

            textarea.property-control {
                min-height: 90px;
                resize: vertical;
                line-height: 1.55;
            }

            .textarea-icon {
                align-items: flex-start;
                padding-top: .78rem;
            }

            /* =========================================================
               EFECTO POR CAMPO
            ========================================================= */

            .field-group {
                animation: fieldAppear .35s ease both;
            }

            .field-group:nth-child(1) {
                animation-delay: .02s;
            }

            .field-group:nth-child(2) {
                animation-delay: .04s;
            }

            .field-group:nth-child(3) {
                animation-delay: .06s;
            }

            .field-group:nth-child(4) {
                animation-delay: .08s;
            }

            .field-group:nth-child(5) {
                animation-delay: .10s;
            }

            .field-group:nth-child(6) {
                animation-delay: .12s;
            }

            .field-group:nth-child(7) {
                animation-delay: .14s;
            }

            @keyframes fieldAppear {
                from {
                    opacity: 0;
                    transform: translateY(5px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* =========================================================
               BOTONES
            ========================================================= */

            .form-actions {
                position: relative;
                z-index: 2;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: .65rem;
                padding: 1.05rem 1.5rem;
                background: rgba(250, 252, 255, .8);
                border-top: 1px solid var(--property-border);
            }

            .btn-cancel-property {
                min-height: 39px;
                padding: .55rem 1.05rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                color: #68768b;
                background: #fff;
                border: 1px solid #e0e6ee;
                border-radius: 11px;
                font-size: .72rem;
                font-weight: 650;
                text-decoration: none;
                transition:
                    transform .18s ease,
                    color .18s ease,
                    background-color .18s ease,
                    border-color .18s ease,
                    box-shadow .18s ease;
            }

            .btn-cancel-property:hover {
                color: #3f4c60;
                background: #f8fafc;
                border-color: #d5dde7;
                transform: translateY(-1px);
                box-shadow: 0 5px 13px rgba(55, 73, 107, .06);
            }

            .btn-save-property {
                min-height: 39px;
                padding: .55rem 1.15rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: .45rem;
                color: #fff;
                background:
                    linear-gradient(
                        135deg,
                        var(--property-primary),
                        #5d88f7
                    );
                border: 1px solid var(--property-primary);
                border-radius: 11px;
                font-size: .72rem;
                font-weight: 680;
                box-shadow: 0 7px 17px rgba(79, 124, 255, .18);
                transition:
                    transform .18s ease,
                    box-shadow .18s ease,
                    background .18s ease;
            }

            .btn-save-property:hover {
                color: #fff;
                background:
                    linear-gradient(
                        135deg,
                        var(--property-primary-dark),
                        var(--property-primary)
                    );
                transform: translateY(-1px);
                box-shadow: 0 9px 21px rgba(79, 124, 255, .24);
            }

            .btn-save-property:active,
            .btn-cancel-property:active {
                transform: translateY(0);
            }

            /* =========================================================
               RESPONSIVE
            ========================================================= */

            @media (max-width: 767.98px) {
                .property-form-card {
                    border-radius: 18px;
                }

                .property-form-content {
                    padding: 1.15rem;
                }

                .form-actions {
                    padding: 1rem 1.15rem;
                }
            }

            @media (max-width: 575.98px) {
                .form-section-header {
                    align-items: flex-start;
                }

                .form-section-icon {
                    width: 40px;
                    height: 40px;
                    min-width: 40px;
                }

                .form-actions {
                    flex-direction: column-reverse;
                }

                .btn-cancel-property,
                .btn-save-property {
                    width: 100%;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .property-form-page,
                .property-form-card,
                .property-input-group,
                .property-input-icon,
                .property-control,
                .field-group,
                .btn-cancel-property,
                .btn-save-property {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>


        <div class="property-form-page">

            <!-- ==========================================
                 FORMULARIO
            =========================================== -->

            <form class="property-form-card"
                  th:object="${inmueble}"
                  th:action="${inmueble.idInmueble == null} ? @{/inmuebles/guardar} : @{/inmuebles/{id}/actualizar(id=${inmueble.idInmueble})}"
                  method="post">


                <div class="property-form-content">

                    <!-- ==========================================
                         ENCABEZADO
                    =========================================== -->

                    <div class="form-section-header">

                        <div class="form-section-icon">
                            <i class="bi bi-geo-alt-fill"></i>
                        </div>


                        <div>

                            <h5 class="form-section-title">
                                Ubicación y Datos del Predio
                            </h5>

                            <p class="form-section-subtitle">
                                Los campos marcados con
                                (<span class="required-mark">*</span>)
                                son obligatorios
                            </p>

                        </div>

                    </div>


                    <!-- ==========================================
                         CAMPOS
                    =========================================== -->

                    <div class="row g-3">


                        <!-- CÓDIGO -->

                        <div class="col-md-4 field-group">

                            <label class="property-label">
                                Código&nbsp;
                                <span class="required-mark">*</span>
                            </label>


                            <div class="property-input-group">

                                <span class="property-input-icon">
                                    <i class="bi bi-qr-code"></i>
                                </span>


                                <input class="form-control property-control"
                                       th:field="*{codigoInmueble}"
                                       placeholder="Ej. INM-001"
                                       required>

                            </div>

                        </div>


                        <!-- DIRECCIÓN -->

                        <div class="col-md-8 field-group">

                            <label class="property-label">
                                Dirección&nbsp;
                                <span class="required-mark">*</span>
                            </label>


                            <div class="property-input-group">

                                <span class="property-input-icon">
                                    <i class="bi bi-house-door"></i>
                                </span>


                                <input class="form-control property-control"
                                       th:field="*{direccion}"
                                       placeholder="Av. Principal N° 123"
                                       required>

                            </div>

                        </div>


                        <!-- DISTRITO -->

                        <div class="col-md-4 field-group">

                            <label class="property-label">
                                Distrito
                            </label>


                            <div class="property-input-group">

                                <span class="property-input-icon">
                                    <i class="bi bi-map"></i>
                                </span>


                                <input class="form-control property-control"
                                       th:field="*{distrito}"
                                       placeholder="Nombre del distrito">

                            </div>

                        </div>


                        <!-- SECTOR -->

                        <div class="col-md-4 field-group">

                            <label class="property-label">
                                Sector
                            </label>


                            <div class="property-input-group">

                                <span class="property-input-icon">
                                    <i class="bi bi-pin-map"></i>
                                </span>


                                <input class="form-control property-control"
                                       th:field="*{sector}"
                                       placeholder="Ej. Sector A / Urbana">

                            </div>

                        </div>


                        <!-- MANZANA -->

                        <div class="col-md-2 field-group">

                            <label class="property-label">
                                Manzana
                            </label>


                            <div class="property-input-group">

                                <span class="property-input-icon">
                                    <i class="bi bi-grid-3x3"></i>
                                </span>


                                <input class="form-control property-control"
                                       th:field="*{manzana}"
                                       placeholder="Mz. A">

                            </div>

                        </div>


                        <!-- LOTE -->

                        <div class="col-md-2 field-group">

                            <label class="property-label">
                                Lote
                            </label>


                            <div class="property-input-group">

                                <span class="property-input-icon">
                                    <i class="bi bi-bounding-box-circles"></i>
                                </span>


                                <input class="form-control property-control"
                                       th:field="*{numeroLote}"
                                       placeholder="Lt. 12">

                            </div>

                        </div>


                        <!-- REFERENCIA -->

                        <div class="col-12 field-group">

                            <label class="property-label">
                                Referencia de Ubicación
                            </label>


                            <div class="property-input-group">

                                <span class="property-input-icon textarea-icon">
                                    <i class="bi bi-info-circle"></i>
                                </span>


                                <textarea class="form-control property-control"
                                          rows="3"
                                          th:field="*{referencia}"
                                          placeholder="Cerca al parque principal, al costado de..."></textarea>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ==========================================
                     ACCIONES
                =========================================== -->

                <div class="form-actions">

                    <a class="btn-cancel-property"
                       th:href="@{/inmuebles}">
                        Cancelar
                    </a>


                    <button type="submit"
                            class="btn-save-property">

                        <i class="bi bi-check2-circle"></i>

                        <span>
                            Guardar Inmueble
                        </span>

                    </button>

                </div>

            </form>

        </div>

    </section>

</main>


<div th:replace="~{fragments/layout :: scripts}"></div>


<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<script>
    document.addEventListener("DOMContentLoaded", function () {

        // Formateo automático a mayúsculas para campos clave
        // (Manzana, Lote y Código)

        const inputsUppercase =
            document.querySelectorAll(
                'input[name="manzana"], input[name="numeroLote"], input[name="codigoInmueble"]'
            );


        inputsUppercase.forEach(input => {

            input.addEventListener(
                "input",
                function () {

                    this.value =
                        this.value.toUpperCase();

                }
            );

        });

    });
</script>

</body>
</html>
