<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>

<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="app-main">

    <div th:replace="~{fragments/layout :: topbar('Usuarios')}"></div>

    <section class="content px-3 px-lg-4 py-4">

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <style>
            :root {
                --users-primary: #4f7cff;
                --users-primary-dark: #416ce5;
                --users-primary-soft: #eef4ff;

                --users-cyan: #39b8c9;
                --users-cyan-soft: #ecfbfd;

                --users-green: #3aaa83;
                --users-green-soft: #edf9f5;

                --users-red: #d96c75;
                --users-red-soft: #fff0f2;

                --users-violet: #7b78d9;
                --users-violet-soft: #f2f1ff;

                --users-dark: #172033;
                --users-text: #536176;
                --users-muted: #8491a5;

                --users-border: #e8edf5;
                --users-bg: #f7f9fc;
            }


            /* =====================================================
               BASE
            ===================================================== */

            body {
                background:
                    radial-gradient(
                        circle at 8% 5%,
                        rgba(79, 124, 255, .055),
                        transparent 25%
                    ),
                    radial-gradient(
                        circle at 95% 8%,
                        rgba(57, 184, 201, .045),
                        transparent 24%
                    ),
                    var(--users-bg) !important;
            }

            .users-page {
                width: 100%;
                max-width: 1500px;
                margin: 0 auto;

                animation: usersAppear .4s ease both;
            }

            @keyframes usersAppear {
                from {
                    opacity: 0;
                    transform: translateY(7px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }


            /* =====================================================
               ENCABEZADO
            ===================================================== */

            .users-header {
                position: relative;
                overflow: hidden;

                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;

                margin-bottom: 1rem;
                padding: 1.1rem 1.25rem;

                background:
                    linear-gradient(
                        135deg,
                        rgba(255,255,255,.99),
                        rgba(248,251,255,.98)
                    );

                border: 1px solid var(--users-border);
                border-radius: 18px;

                box-shadow:
                    0 7px 24px rgba(55, 73, 107, .05);
            }

            .users-header::after {
                content: "";

                position: absolute;

                width: 180px;
                height: 180px;

                right: -85px;
                top: -115px;

                border-radius: 50%;

                background:
                    radial-gradient(
                        circle,
                        rgba(79, 124, 255, .075),
                        transparent 68%
                    );

                pointer-events: none;
            }

            .users-header-info {
                position: relative;
                z-index: 2;

                display: flex;
                align-items: center;
                gap: .8rem;
            }

            .users-header-icon {
                width: 45px;
                height: 45px;
                min-width: 45px;

                display: flex;
                align-items: center;
                justify-content: center;

                color: var(--users-primary);

                background:
                    linear-gradient(
                        145deg,
                        var(--users-primary-soft),
                        #fbfdff
                    );

                border:
                    1px solid rgba(79, 124, 255, .11);

                border-radius: 13px;

                box-shadow:
                    0 5px 14px rgba(79, 124, 255, .055);

                font-size: .95rem;

                transition:
                    transform .2s ease,
                    box-shadow .2s ease;
            }

            .users-header:hover
            .users-header-icon {
                transform:
                    translateY(-2px) rotate(-2deg);

                box-shadow:
                    0 8px 18px rgba(79, 124, 255, .09);
            }

            .users-title {
                margin: 0 0 .15rem;

                color: var(--users-dark);

                font-size: 1.08rem;
                font-weight: 780;

                letter-spacing: -.025em;
            }

            .users-description {
                margin: 0;

                color: var(--users-muted);

                font-size: .62rem;
                font-weight: 500;
            }


            /* =====================================================
               NUEVO USUARIO
            ===================================================== */

            .btn-new-user {
                position: relative;
                z-index: 2;

                min-height: 40px;

                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: .4rem;

                padding: .55rem .9rem;

                color: #fff !important;

                background:
                    linear-gradient(
                        135deg,
                        var(--users-primary),
                        #5c88f5
                    );

                border: 1px solid var(--users-primary);
                border-radius: 10px;

                box-shadow:
                    0 7px 18px rgba(79, 124, 255, .17);

                font-size: .64rem;
                font-weight: 700;

                text-decoration: none;

                transition:
                    transform .18s ease,
                    box-shadow .18s ease,
                    background .18s ease;
            }

            .btn-new-user:hover {
                background:
                    linear-gradient(
                        135deg,
                        var(--users-primary-dark),
                        var(--users-primary)
                    );

                transform: translateY(-1px);

                box-shadow:
                    0 10px 23px rgba(79, 124, 255, .23);
            }

            .btn-new-user i {
                font-size: .72rem;

                transition:
                    transform .18s ease;
            }

            .btn-new-user:hover i {
                transform: rotate(90deg);
            }


            /* =====================================================
               PANEL DE TABLA
            ===================================================== */

            .users-table-card {
                position: relative;
                overflow: hidden;

                background:
                    linear-gradient(
                        145deg,
                        rgba(255,255,255,.995),
                        rgba(252,253,255,.99)
                    );

                border: 1px solid var(--users-border);
                border-radius: 20px;

                box-shadow:
                    0 12px 36px rgba(55, 73, 107, .06);

                transition:
                    border-color .2s ease,
                    box-shadow .2s ease;
            }

            .users-table-card:hover {
                border-color:
                    rgba(79, 124, 255, .10);

                box-shadow:
                    0 16px 42px rgba(55, 73, 107, .075);
            }

            .users-table-card::before {
                content: "";

                position: absolute;

                width: 190px;
                height: 190px;

                left: -120px;
                bottom: -130px;

                border-radius: 50%;

                background:
                    radial-gradient(
                        circle,
                        rgba(57, 184, 201, .045),
                        transparent 70%
                    );

                pointer-events: none;
            }


            /* =====================================================
               TABLA
            ===================================================== */

            .users-table-wrapper {
                position: relative;
                z-index: 2;

                width: 100%;
                overflow-x: auto;
            }

            .users-table {
                width: 100%;

                margin: 0 !important;

                border-collapse: separate;
                border-spacing: 0;
            }

            .users-table thead th {
                padding: .78rem 1rem;

                color: #78869a;

                background:
                    linear-gradient(
                        180deg,
                        #fbfcfe,
                        #f8fafd
                    );

                border: 0;
                border-bottom:
                    1px solid var(--users-border);

                font-size: .56rem;
                font-weight: 750;

                letter-spacing: .045em;
                text-transform: uppercase;

                white-space: nowrap;
            }

            .users-table tbody td {
                padding: .78rem 1rem;

                color: var(--users-text);

                background: rgba(255,255,255,.78);

                border: 0;
                border-bottom:
                    1px solid #eff2f6;

                font-size: .64rem;

                vertical-align: middle;

                transition:
                    background-color .18s ease;
            }

            .users-table tbody tr:last-child td {
                border-bottom: 0;
            }

            .users-table tbody tr {
                transition:
                    transform .18s ease,
                    box-shadow .18s ease;
            }

            .users-table tbody tr:hover td {
                background:
                    linear-gradient(
                        90deg,
                        rgba(79,124,255,.025),
                        rgba(57,184,201,.018)
                    );
            }


            /* =====================================================
               USUARIO
            ===================================================== */

            .user-identity {
                display: flex;
                align-items: center;
                gap: .65rem;

                min-width: 150px;
            }

            .user-avatar {
                width: 34px;
                height: 34px;
                min-width: 34px;

                display: flex;
                align-items: center;
                justify-content: center;

                color: var(--users-primary);

                background:
                    linear-gradient(
                        145deg,
                        var(--users-primary-soft),
                        #f7faff
                    );

                border:
                    1px solid rgba(79,124,255,.10);

                border-radius: 10px;

                box-shadow:
                    0 4px 10px rgba(79,124,255,.05);

                font-size: .69rem;
                font-weight: 800;

                text-transform: uppercase;

                transition:
                    transform .18s ease,
                    box-shadow .18s ease;
            }

            .users-table tbody tr:hover
            .user-avatar {
                transform:
                    translateY(-1px) scale(1.03);

                box-shadow:
                    0 6px 14px rgba(79,124,255,.09);
            }

            .username-text {
                color: var(--users-dark);

                font-size: .65rem;
                font-weight: 720;
            }

            .person-name {
                color: #4c5a6e;

                font-weight: 600;
            }

            .email-value {
                display: inline-flex;
                align-items: center;
                gap: .35rem;

                color: #667489;

                white-space: nowrap;
            }

            .email-value i {
                color: #9aa6b6;

                font-size: .66rem;
            }


            /* =====================================================
               FORMULARIOS INLINE
            ===================================================== */

            .inline-user-form {
                display: flex;
                align-items: center;
                gap: .4rem;

                margin: 0;
            }

            .users-select {
                min-width: 105px;
                height: 34px;

                padding:
                    .35rem 1.8rem .35rem .65rem;

                color: #56657a;

                background-color: #fafbfd;

                border:
                    1px solid #e3e8f0;

                border-radius: 9px;

                box-shadow: none !important;

                font-size: .58rem;
                font-weight: 650;

                cursor: pointer;

                transition:
                    background-color .18s ease,
                    border-color .18s ease,
                    box-shadow .18s ease;
            }

            .users-select:hover {
                background-color: #fff;

                border-color: #d8e0ea;
            }

            .users-select:focus {
                background-color: #fff;

                border-color:
                    rgba(79,124,255,.42);

                box-shadow:
                    0 0 0 3px rgba(79,124,255,.065) !important;
            }


            /* =====================================================
               ESTADO
            ===================================================== */

            .status-control {
                position: relative;
                display: inline-flex;
                align-items: center;
            }

            .status-dot {
                position: absolute;

                left: .65rem;

                width: 6px;
                height: 6px;

                z-index: 2;

                border-radius: 50%;

                pointer-events: none;

                background: var(--users-muted);

                box-shadow:
                    0 0 0 3px rgba(132,145,165,.08);
            }

            .status-dot.active {
                background: var(--users-green);

                box-shadow:
                    0 0 0 3px rgba(58,170,131,.10);
            }

            .status-dot.inactive {
                background: var(--users-red);

                box-shadow:
                    0 0 0 3px rgba(217,108,117,.09);
            }

            .status-select {
                min-width: 112px;

                padding-left: 1.55rem;
            }

            .status-select.status-active {
                color: #397861;

                background-color:
                    var(--users-green-soft);

                border-color:
                    rgba(58,170,131,.12);
            }

            .status-select.status-inactive {
                color: #a8565e;

                background-color:
                    var(--users-red-soft);

                border-color:
                    rgba(217,108,117,.12);
            }


            /* =====================================================
               ROL
            ===================================================== */

            .role-select {
                min-width: 125px;

                color: #66639c;

                background-color:
                    var(--users-violet-soft);

                border-color:
                    rgba(123,120,217,.11);
            }

            .role-select:focus {
                border-color:
                    rgba(123,120,217,.35);

                box-shadow:
                    0 0 0 3px rgba(123,120,217,.06) !important;
            }


            /* =====================================================
               BOTONES DE FILA
            ===================================================== */

            .btn-row-action {
                height: 34px;

                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: .3rem;

                padding: .35rem .65rem;

                border-radius: 9px;

                font-size: .57rem;
                font-weight: 700;

                white-space: nowrap;

                transition:
                    transform .18s ease,
                    box-shadow .18s ease,
                    background-color .18s ease,
                    border-color .18s ease;
            }

            .btn-save-state {
                color: #536176;

                background: #f4f7fa;

                border: 1px solid #e1e7ee;
            }

            .btn-save-state:hover {
                color: var(--users-primary);

                background: var(--users-primary-soft);

                border-color:
                    rgba(79,124,255,.13);

                transform: translateY(-1px);

                box-shadow:
                    0 5px 12px rgba(55,73,107,.06);
            }

            .btn-assign-role {
                color: var(--users-primary);

                background: #fff;

                border:
                    1px solid rgba(79,124,255,.23);
            }

            .btn-assign-role:hover {
                color: #fff;

                background:
                    var(--users-primary);

                border-color:
                    var(--users-primary);

                transform: translateY(-1px);

                box-shadow:
                    0 6px 14px rgba(79,124,255,.15);
            }

            .btn-row-action i {
                font-size: .61rem;
            }


            /* =====================================================
               RESPONSIVE
            ===================================================== */

            @media (max-width: 991.98px) {

                .users-table {
                    min-width: 880px;
                }
            }

            @media (max-width: 767.98px) {

                .users-header {
                    align-items: flex-start;
                    flex-direction: column;

                    padding: 1rem;

                    border-radius: 16px;
                }

                .btn-new-user {
                    width: 100%;
                }

                .users-table-card {
                    border-radius: 17px;
                }
            }

            @media (max-width: 575.98px) {

                .users-title {
                    font-size: .98rem;
                }

                .users-description {
                    font-size: .57rem;
                }

                .users-header-icon {
                    width: 41px;
                    height: 41px;
                    min-width: 41px;
                }

                .users-table thead th,
                .users-table tbody td {
                    padding:
                        .7rem .8rem;
                }
            }


            /* =====================================================
               REDUCIR MOVIMIENTO
            ===================================================== */

            @media (prefers-reduced-motion: reduce) {

                .users-page,
                .users-header-icon,
                .btn-new-user,
                .btn-new-user i,
                .users-table-card,
                .user-avatar,
                .users-select,
                .btn-row-action {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>


        <div class="users-page">


            <!-- ================================================= -->
            <!-- ENCABEZADO -->
            <!-- ================================================= -->

            <div class="users-header page-actions">

                <div class="users-header-info">

                    <div class="users-header-icon">
                        <i class="bi bi-people"></i>
                    </div>

                    <div>

                        <h2 class="users-title">
                            Usuarios del sistema
                        </h2>

                        <p class="users-description">
                            Accesos y estados de las cuentas.
                        </p>

                    </div>

                </div>


                <a class="btn-new-user"
                   th:href="@{/seguridad/usuarios/nuevo}">

                    <i class="bi bi-plus-lg"></i>

                    <span>
                        Nuevo usuario
                    </span>

                </a>

            </div>


            <!-- ================================================= -->
            <!-- TABLA -->
            <!-- ================================================= -->

            <div class="users-table-card surface">

                <div class="users-table-wrapper">

                    <table class="table users-table">

                        <thead>

                        <tr>

                            <th>
                                Usuario
                            </th>

                            <th>
                                Nombre
                            </th>

                            <th>
                                Correo
                            </th>

                            <th>
                                Estado
                            </th>

                            <th>
                                Asignar rol
                            </th>

                        </tr>

                        </thead>


                        <tbody>


                        <tr th:each="u : ${usuarios}">


                            <!-- ================================= -->
                            <!-- USUARIO -->
                            <!-- ================================= -->

                            <td>

                                <div class="user-identity">

                                    <div class="user-avatar"
                                         th:text="${#strings.isEmpty(u.username) ? 'U' : #strings.substring(u.username, 0, 1)}">
                                        U
                                    </div>

                                    <b class="username-text"
                                       th:text="${u.username}">
                                        usuario
                                    </b>

                                </div>

                            </td>


                            <!-- ================================= -->
                            <!-- NOMBRE -->
                            <!-- ================================= -->

                            <td>

                                <span class="person-name"
                                      th:text="${u.nombres + ' ' + (u.apellidos ?: '')}">
                                    Nombre del usuario
                                </span>

                            </td>


                            <!-- ================================= -->
                            <!-- CORREO -->
                            <!-- ================================= -->

                            <td>

                                <span class="email-value">

                                    <i class="bi bi-envelope"></i>

                                    <span th:text="${u.correo}">
                                        correo@ejemplo.com
                                    </span>

                                </span>

                            </td>


                            <!-- ================================= -->
                            <!-- ESTADO -->
                            <!-- ================================= -->

                            <td>

                                <form class="inline-user-form"
                                      th:action="@{/seguridad/usuarios/{id}/estado(id=${u.idUsuario})}"
                                      method="post">


                                    <div class="status-control">

                                        <span class="status-dot"
                                              th:classappend="${u.estado == 'ACTIVO' ? 'active' : 'inactive'}">
                                        </span>


                                        <select class="form-select form-select-sm users-select status-select"
                                                th:classappend="${u.estado == 'ACTIVO' ? 'status-active' : 'status-inactive'}"
                                                name="estado">

                                            <option th:selected="${u.estado=='ACTIVO'}">
                                                ACTIVO
                                            </option>

                                            <option th:selected="${u.estado=='INACTIVO'}">
                                                INACTIVO
                                            </option>

                                        </select>

                                    </div>


                                    <button class="btn-row-action btn-save-state"
                                            type="submit">

                                        <i class="bi bi-check2"></i>

                                        <span>
                                            Guardar
                                        </span>

                                    </button>

                                </form>

                            </td>


                            <!-- ================================= -->
                            <!-- ROL -->
                            <!-- ================================= -->

                            <td>

                                <form class="inline-user-form"
                                      th:action="@{/seguridad/usuarios/{id}/rol(id=${u.idUsuario})}"
                                      method="post">


                                    <select class="form-select form-select-sm users-select role-select"
                                            name="idRol">

                                        <option th:each="r : ${roles}"
                                                th:value="${r.idRol}"
                                                th:text="${r.nombre}"
                                                th:selected="${rolesPorUsuario[u.idUsuario] != null
                and rolesPorUsuario[u.idUsuario] == r.idRol}">
                                        </option>

                                    </select>


                                    <button class="btn-row-action btn-assign-role"
                                            type="submit">

                                        <i class="bi bi-shield-check"></i>

                                        <span>
                                            Asignar
                                        </span>

                                    </button>

                                </form>

                            </td>

                        </tr>


                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </section>

</main>


<div th:replace="~{fragments/layout :: scripts}"></div>


<script>
    document
        .querySelectorAll('.status-select')
        .forEach(select => {

            select.addEventListener('change', function () {

                const wrapper =
                    this.closest('.status-control');

                const dot =
                    wrapper?.querySelector('.status-dot');

                const active =
                    this.value === 'ACTIVO';


                this.classList.toggle(
                    'status-active',
                    active
                );

                this.classList.toggle(
                    'status-inactive',
                    !active
                );


                if (dot) {

                    dot.classList.toggle(
                        'active',
                        active
                    );

                    dot.classList.toggle(
                        'inactive',
                        !active
                    );

                }

            });

        });
</script>

</body>

</html>
