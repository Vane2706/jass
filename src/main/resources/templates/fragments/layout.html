<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${title} + ' | JASS Mishquiyacu'">
        JASS
    </title>


    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">


    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- FUENTES -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
          rel="stylesheet">


    <!-- ESTILOS DEL PROYECTO -->
    <link rel="stylesheet"
          th:href="@{/css/app.css}">

    <link rel="stylesheet"
          th:href="@{/css/index.css}">


    <!-- ===================================================== -->
    <!-- ESTILO GLOBAL DEL LAYOUT -->
    <!-- ===================================================== -->

    <style>

        :root {
            --layout-primary: #4f7cff;
            --layout-primary-dark: #416ce5;
            --layout-primary-soft: #eef4ff;

            --layout-cyan: #39b8c9;
            --layout-cyan-dark: #2fa4b4;
            --layout-cyan-soft: #ecfbfd;

            --layout-green: #3aaa83;
            --layout-green-soft: #edf9f5;

            --layout-red: #d96c75;
            --layout-red-soft: #fff0f2;

            --layout-dark: #172033;
            --layout-text: #536176;
            --layout-muted: #8491a5;

            --layout-border: #e8edf5;
            --layout-bg: #f7f9fc;
            --layout-white: #ffffff;

            --sidebar-width: 246px;
            --topbar-height: 76px;

            --layout-shadow:
                0 10px 35px rgba(55, 73, 107, .07);
        }


        /* =====================================================
           BASE
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;

            color: var(--layout-text);

            background:
                radial-gradient(
                    circle at 5% 3%,
                    rgba(79, 124, 255, .065),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 96% 5%,
                    rgba(57, 184, 201, .05),
                    transparent 23%
                ),
                var(--layout-bg);

            font-family:
                'Inter',
                sans-serif;

            font-size: .86rem;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .brand {
            font-family:
                'Plus Jakarta Sans',
                sans-serif;
        }

        a {
            text-decoration: none;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            position: fixed;

            top: 0;
            left: 0;
            bottom: 0;

            z-index: 1040;

            width: var(--sidebar-width);

            display: flex;
            flex-direction: column;

            padding:
                .9rem .8rem 1rem;

            background:
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, .99) 0%,
                    rgba(249, 251, 255, .99) 100%
                );

            border-right:
                1px solid var(--layout-border);

            box-shadow:
                8px 0 30px rgba(55, 73, 107, .035);

            overflow-y: auto;
            overflow-x: hidden;

            transition:
                transform .28s cubic-bezier(.4, 0, .2, 1),
                box-shadow .28s ease;
        }


        /* SCROLL */

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #dce4ef;
            border-radius: 999px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #cbd6e4;
        }


        /* =====================================================
           MARCA
        ===================================================== */

        .brand {
            position: relative;

            display: flex;
            align-items: center;

            gap: .72rem;

            min-height: 58px;

            padding:
                .6rem .65rem;

            margin-bottom:
                .75rem;

            color:
                var(--layout-dark);

            border-radius:
                14px;

            transition:
                background-color .2s ease,
                transform .2s ease;
        }

        .brand:hover {
            color:
                var(--layout-dark);

            background:
                rgba(238, 244, 255, .7);

            transform:
                translateY(-1px);
        }

        .brand-drop {
            position: relative;

            width: 39px;
            height: 39px;
            min-width: 39px;

            display: flex;
            align-items: center;
            justify-content: center;

            color:
                var(--layout-cyan);

            background:
                linear-gradient(
                    145deg,
                    var(--layout-cyan-soft),
                    #f8feff
                );

            border:
                1px solid rgba(57, 184, 201, .13);

            border-radius:
                12px;

            box-shadow:
                0 5px 14px rgba(57, 184, 201, .07);

            font-size:
                1rem;

            transition:
                transform .22s ease,
                box-shadow .22s ease;
        }

        .brand:hover
        .brand-drop {
            transform:
                rotate(-5deg);

            box-shadow:
                0 7px 18px rgba(57, 184, 201, .11);
        }

        .brand-name {
            min-width: 0;

            display: flex;
            flex-direction: column;

            line-height: 1.05;
        }

        .brand-name b {
            color:
                var(--layout-dark);

            font-size:
                .92rem;

            font-weight:
                800;

            letter-spacing:
                -.02em;
        }

        .brand-name small {
            margin-top:
                .23rem;

            color:
                var(--layout-muted);

            font-family:
                'Inter',
                sans-serif;

            font-size:
                .57rem;

            font-weight:
                600;

            letter-spacing:
                .035em;
        }


        /* =====================================================
           NAVEGACIÓN
        ===================================================== */

        .side-nav {
            display: flex;
            flex-direction: column;

            gap: .16rem;
        }

        .nav-label {
            padding:
                .75rem .68rem .35rem;

            color:
                #9aa5b6;

            font-size:
                .51rem;

            font-weight:
                750;

            letter-spacing:
                .105em;

            text-transform:
                uppercase;

            user-select:
                none;
        }

        .side-nav > a {
            position: relative;

            min-height: 39px;

            display: flex;
            align-items: center;

            gap: .67rem;

            padding:
                .48rem .62rem;

            color:
                #637087;

            border:
                1px solid transparent;

            border-radius:
                10px;

            font-size:
                .68rem;

            font-weight:
                570;

            transition:
                color .18s ease,
                background-color .18s ease,
                border-color .18s ease,
                transform .18s ease,
                box-shadow .18s ease;
        }

        .side-nav > a::before {
            content: "";

            position: absolute;

            left: -1px;
            top: 50%;

            width: 3px;
            height: 0;

            border-radius:
                0 999px 999px 0;

            background:
                linear-gradient(
                    180deg,
                    var(--layout-primary),
                    var(--layout-cyan)
                );

            transform:
                translateY(-50%);

            opacity:
                0;

            transition:
                height .18s ease,
                opacity .18s ease;
        }

        .side-nav > a:hover {
            color:
                #40506a;

            background:
                #f6f9fd;

            border-color:
                #edf1f6;

            transform:
                translateX(2px);
        }

        .side-nav > a:hover::before {
            height:
                18px;

            opacity:
                1;
        }

        .side-nav > a i {
            width:
                29px;

            height:
                29px;

            min-width:
                29px;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                #8290a5;

            background:
                #f6f8fb;

            border:
                1px solid #edf1f5;

            border-radius:
                8px;

            font-size:
                .73rem;

            transition:
                color .18s ease,
                background-color .18s ease,
                border-color .18s ease,
                transform .18s ease;
        }

        .side-nav > a:hover i {
            color:
                var(--layout-primary);

            background:
                var(--layout-primary-soft);

            border-color:
                rgba(79, 124, 255, .10);

            transform:
                scale(1.03);
        }

        .side-nav > a span {
            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;
        }

        /* =====================================================
   OPCIÓN ACTIVA
   ===================================================== */

.side-nav > a.active {
    color: #40506a;

    background: var(--layout-primary-soft);

    border-color: rgba(79, 124, 255, .12);

    font-weight: 680;

    box-shadow:
        0 3px 10px rgba(79, 124, 255, .05);

    transform: translateX(2px);
}


.side-nav > a.active::before {
    height: 21px;

    opacity: 1;
}


.side-nav > a.active i {
    color: var(--layout-primary);

    background: #ffffff;

    border-color: rgba(79, 124, 255, .14);

    box-shadow:
        0 3px 8px rgba(79, 124, 255, .06);
}


.side-nav > a.active:hover {
    background: var(--layout-primary-soft);
}


.side-nav > a.active:hover i {
    background: #ffffff;
}


        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {
            position:
                sticky;

            top:
                0;

            z-index:
                1020;

            min-height:
                var(--topbar-height);

            margin-left:
                var(--sidebar-width);

            padding:
                .8rem 1.45rem;

            display:
                flex;

            align-items:
                center;

            gap:
                .8rem;

            background:
                rgba(255, 255, 255, .89);

            border-bottom:
                1px solid rgba(232, 237, 245, .92);

            box-shadow:
                0 5px 22px rgba(55, 73, 107, .035);

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);
        }

        .topbar-title {
            min-width:
                0;
        }

        .topbar-title h1 {
            margin:
                0 0 .1rem;

            color:
                var(--layout-dark);

            font-size:
                .96rem;

            font-weight:
                760;

            letter-spacing:
                -.025em;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }

        .topbar-title p {
            margin:
                0;

            color:
                var(--layout-muted);

            font-size:
                .58rem;

            font-weight:
                500;
        }


        /* =====================================================
           BOTÓN MENÚ
        ===================================================== */

        .menu-btn {
            width:
                38px;

            height:
                38px;

            min-width:
                38px;

            display:
                none;

            align-items:
                center;

            justify-content:
                center;

            padding:
                0;

            color:
                #68768b;

            background:
                #f8fafc;

            border:
                1px solid #e7ecf3;

            border-radius:
                10px;

            font-size:
                .95rem;

            cursor:
                pointer;

            transition:
                color .18s ease,
                background-color .18s ease,
                border-color .18s ease,
                transform .18s ease;
        }

        .menu-btn:hover {
            color:
                var(--layout-primary);

            background:
                var(--layout-primary-soft);

            border-color:
                rgba(79, 124, 255, .13);

            transform:
                translateY(-1px);
        }


        /* =====================================================
           USUARIO
        ===================================================== */

        .topbar-user {
            margin-left:
                auto;

            display:
                flex;

            align-items:
                center;

            gap:
                .7rem;
        }

        .user-indicator {
            display:
                flex;

            align-items:
                center;

            gap:
                .45rem;

            padding:
                .36rem .58rem;

            color:
                #647289;

            background:
                #f8fafc;

            border:
                1px solid #edf1f5;

            border-radius:
                9px;

            font-size:
                .62rem;

            font-weight:
                620;
        }

        .status-dot {
            position:
                relative;

            width:
                7px;

            height:
                7px;

            min-width:
                7px;

            border-radius:
                50%;

            background:
                var(--layout-green);

            box-shadow:
                0 0 0 3px rgba(58, 170, 131, .10);
        }

        .status-dot::after {
            content: "";

            position:
                absolute;

            inset:
                -3px;

            border:
                1px solid rgba(58, 170, 131, .18);

            border-radius:
                50%;

            animation:
                statusPulse 2.2s ease-out infinite;
        }

        @keyframes statusPulse {
            0% {
                transform:
                    scale(.8);

                opacity:
                    .65;
            }

            70%,
            100% {
                transform:
                    scale(1.7);

                opacity:
                    0;
            }
        }


        /* =====================================================
           CERRAR SESIÓN
        ===================================================== */

        .logout-form {
            margin:
                0;
        }

        .btn-logout {
            min-height:
                36px;

            padding:
                .45rem .72rem;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                .35rem;

            color:
                #64748a;

            background:
                #fff;

            border:
                1px solid #dfe6ef;

            border-radius:
                9px;

            font-size:
                .61rem;

            font-weight:
                650;

            transition:
                color .18s ease,
                background-color .18s ease,
                border-color .18s ease,
                transform .18s ease,
                box-shadow .18s ease;
        }

        .btn-logout:hover {
            color:
                #bd5962;

            background:
                var(--layout-red-soft);

            border-color:
                rgba(217, 108, 117, .18);

            transform:
                translateY(-1px);

            box-shadow:
                0 6px 15px rgba(217, 108, 117, .08);
        }


        /* =====================================================
           CONTENIDO GLOBAL
        ===================================================== */

        .app-main {
            min-height:
                100vh;

            margin-left:
                var(--sidebar-width);

            transition:
                margin-left .28s ease;
        }

        .app-main > .topbar {
            margin-left:
                0;
        }

        .content {
            width:
                100%;
        }


        /* =====================================================
           ALERTAS
        ===================================================== */

        .system-alert {
            position:
                relative;

            overflow:
                hidden;

            display:
                flex;

            align-items:
                center;

            gap:
                .65rem;

            padding:
                .72rem .85rem;

            margin-bottom:
                .85rem;

            border:
                1px solid;

            border-radius:
                12px;

            box-shadow:
                0 6px 18px rgba(55, 73, 107, .045);

            font-size:
                .66rem;

            font-weight:
                550;

            animation:
                alertAppear .3s ease both;
        }

        @keyframes alertAppear {
            from {
                opacity:
                    0;

                transform:
                    translateY(-5px);
            }

            to {
                opacity:
                    1;

                transform:
                    translateY(0);
            }
        }

        .system-alert::before {
            content: "";

            position:
                absolute;

            left:
                0;

            top:
                0;

            bottom:
                0;

            width:
                3px;
        }

        .system-alert-icon {
            width:
                30px;

            height:
                30px;

            min-width:
                30px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                8px;

            font-size:
                .73rem;
        }

        .system-alert-success {
            color:
                #397862;

            background:
                linear-gradient(
                    135deg,
                    #f6fcfa,
                    var(--layout-green-soft)
                );

            border-color:
                rgba(58, 170, 131, .13);
        }

        .system-alert-success::before {
            background:
                var(--layout-green);
        }

        .system-alert-success
        .system-alert-icon {
            color:
                var(--layout-green);

            background:
                rgba(58, 170, 131, .09);
        }

        .system-alert-error {
            color:
                #a95059;

            background:
                linear-gradient(
                    135deg,
                    #fff9fa,
                    var(--layout-red-soft)
                );

            border-color:
                rgba(217, 108, 117, .13);
        }

        .system-alert-error::before {
            background:
                var(--layout-red);
        }

        .system-alert-error
        .system-alert-icon {
            color:
                var(--layout-red);

            background:
                rgba(217, 108, 117, .09);
        }

        .system-alert
        .btn-close {
            margin-left:
                auto;

            padding:
                .45rem;

            font-size:
                .56rem;

            opacity:
                .45;

            transition:
                opacity .18s ease,
                transform .18s ease;
        }

        .system-alert
        .btn-close:hover {
            opacity:
                .75;

            transform:
                rotate(5deg);
        }


        /* =====================================================
           ELEMENTOS GLOBALES
        ===================================================== */

        ::selection {
            color:
                var(--layout-dark);

            background:
                rgba(79, 124, 255, .16);
        }

        .form-control,
        .form-select {
            border-color:
                #e2e8f0;

            box-shadow:
                none;

            transition:
                border-color .18s ease,
                box-shadow .18s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color:
                rgba(79, 124, 255, .5);

            box-shadow:
                0 0 0 .18rem rgba(79, 124, 255, .08);
        }

        .btn {
            font-weight:
                600;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 991.98px) {

            .sidebar {
                transform:
                    translateX(-100%);

                box-shadow:
                    15px 0 45px rgba(23, 32, 51, .10);
            }

            .sidebar.show,
            .sidebar.active,
            body.sidebar-open .sidebar {
                transform:
                    translateX(0);
            }

            .app-main {
                margin-left:
                    0;
            }

            .topbar {
                margin-left:
                    0;

                padding:
                    .72rem 1rem;
            }

            .menu-btn {
                display:
                    inline-flex;
            }
        }


        @media (max-width: 767.98px) {

            :root {
                --topbar-height:
                    68px;
            }

            .topbar {
                gap:
                    .6rem;
            }

            .topbar-title h1 {
                font-size:
                    .86rem;
            }

            .topbar-title p {
                display:
                    none;
            }

            .user-indicator {
                padding:
                    .33rem;

                background:
                    transparent;

                border:
                    0;
            }

            .btn-logout span {
                display:
                    none;
            }

            .btn-logout {
                width:
                    36px;

                padding:
                    0;
            }
        }


        @media (max-width: 575.98px) {

            .topbar {
                padding:
                    .65rem .75rem;
            }

            .menu-btn {
                width:
                    36px;

                height:
                    36px;

                min-width:
                    36px;
            }

            .topbar-user {
                gap:
                    .35rem;
            }

            .sidebar {
                width:
                    min(84vw, 260px);
            }
        }


        /* =====================================================
           REDUCIR MOVIMIENTO
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior:
                    auto !important;

                animation-duration:
                    .01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    .01ms !important;
            }
        }


        /* =====================================================
           IMPRESIÓN
        ===================================================== */

        @media print {

            .sidebar,
            .topbar,
            .system-alert {
                display:
                    none !important;
            }

            .app-main {
                margin-left:
                    0 !important;
            }
        }

    </style>

</head>


<body>


<!-- ========================================================= -->
<!-- SIDEBAR -->
<!-- ========================================================= -->

<aside th:fragment="sidebar"
       class="sidebar">


    <!-- MARCA -->

    <a class="brand"
       th:href="@{/}">

        <span class="brand-drop">
            <i class="bi bi-droplet-fill"></i>
        </span>

        <span class="brand-name">

            <b>JASS</b>

            <small>
                Mishquiyacu
            </small>

        </span>

    </a>


    <!-- NAVEGACIÓN -->

    <nav class="side-nav">


        <!-- INICIO -->

        <a th:href="@{/}">

            <i class="bi bi-grid-1x2"></i>

            <span>
                Inicio
            </span>

        </a>


        <!-- GESTIÓN -->

        <div class="nav-label">
            Gestión
        </div>


        <a th:href="@{/asociados}">

            <i class="bi bi-people"></i>

            <span>
                Asociados
            </span>

        </a>


        <a th:href="@{/inmuebles}">

            <i class="bi bi-houses"></i>

            <span>
                Inmuebles
            </span>

        </a>


        <a th:href="@{/servicios}">

            <i class="bi bi-droplet"></i>

            <span>
                Servicios
            </span>

        </a>

        <!--
        <a th:href="@{/lecturas}">

            <i class="bi bi-speedometer2"></i>

            <span>
                Lecturas
            </span>

        </a>-->


        <a th:href="@{/facturacion}">

            <i class="bi bi-receipt"></i>

            <span>
                Recibos
            </span>

        </a>


        <a th:href="@{/pagos}">

            <i class="bi bi-credit-card"></i>

            <span>
                Pagos
            </span>

        </a>


        <a th:href="@{/morosidad}">

            <i class="bi bi-exclamation-triangle"></i>

            <span>
                Morosidad
            </span>

        </a>


        <a th:href="@{/caja}">

            <i class="bi bi-cash-stack"></i>

            <span>
                Caja
            </span>

        </a>


        <!-- OPERACIONES -->

        <div class="nav-label">

<!-- ========================================================= -->
<!-- TOPBAR -->
<!-- ========================================================= -->

<header th:fragment="topbar(title)"
        class="topbar">


    <!-- MENÚ -->

    <button class="menu-btn"
            type="button"
            data-sidebar-toggle
            aria-label="Abrir menú">

        <i class="bi bi-list"></i>

    </button>


    <!-- TÍTULO -->

    <div class="topbar-title">

        <h1 th:text="${title}">
            Panel
        </h1>

        <p>
            Gestión integral del servicio de agua
        </p>

    </div>


    <!-- USUARIO -->

    <div class="topbar-user">


        <div class="user-indicator">

            <span class="status-dot"></span>

            <span class="d-none d-md-inline"
                  th:text="${#authentication?.name}">
                usuario
            </span>

        </div>


        <!-- LOGOUT -->

        <form class="logout-form"
              th:action="@{/logout}"
              method="post">

            <button class="btn-logout"
                    type="submit">

                <i class="bi bi-box-arrow-right"></i>

                <span>
                    Cerrar sesión
                </span>

            </button>

        </form>

    </div>

</header>


<!-- ========================================================= -->
<!-- ALERTAS -->
<!-- ========================================================= -->

<div th:fragment="alerts">


    <!-- ÉXITO -->

    <div th:if="${success}"
         class="alert system-alert system-alert-success alert-dismissible fade show"
         role="alert">

        <span class="system-alert-icon">
            <i class="bi bi-check-lg"></i>
        </span>

        <span th:text="${success}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Cerrar">
        </button>

    </div>


    <!-- ERROR -->

    <div th:if="${error}"
         class="alert system-alert system-alert-error alert-dismissible fade show"
         role="alert">

        <span class="system-alert-icon">
            <i class="bi bi-exclamation-lg"></i>
        </span>

        <span th:text="${error}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Cerrar">
        </button>

    </div>

</div>


<!-- ========================================================= -->
<!-- SCRIPTS -->
<!-- ========================================================= -->

<div th:fragment="scripts">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">
    </script>

    <script th:src="@{/js/app.js}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const currentPath = window.location.pathname;

            document
                .querySelectorAll('.side-nav > a')
                .forEach(link => {

                    const linkPath =
                        new URL(link.href).pathname;

                    let active = false;

                    // INICIO
                    if (linkPath === '/') {
                        active = currentPath === '/';
                    }

                    // DEMÁS OPCIONES
                    else {
                        active =
                            currentPath === linkPath ||
                            currentPath.startsWith(
                                linkPath + '/'
                            );
                    }

                    link.classList.toggle(
                        'active',
                        active
                    );
                });

        });
    </script>

</div>


</body>

</html>
