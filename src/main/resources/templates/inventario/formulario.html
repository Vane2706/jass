<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo material')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="app-main">
    <div th:replace="~{fragments/layout :: topbar('Nuevo material')}"></div>
    <section class="content">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="page-actions">
            <div><h2>Registrar material</h2>
                <p>Agrega un artículo al inventario.</p></div>
        </div>
        <form class="surface form-surface" th:object="${material}" th:action="@{/inventario/guardar}" method="post">
            <div class="row g-3">
                <div class="col-md-4"><label>Código *</label><input class="form-control" th:field="*{codigo}" required>
                </div>
                <div class="col-md-8"><label>Nombre *</label><input class="form-control" th:field="*{nombre}" required>
                </div>
                <div class="col-md-4"><label>Unidad de medida</label><input class="form-control"
                                                                            th:field="*{unidadMedida}"
                                                                            placeholder="unidad, metro, pieza…"></div>
                <div class="col-md-4"><label>Stock actual</label><input class="form-control" type="number" step="0.01"
                                                                        th:field="*{stockActual}"></div>
                <div class="col-md-4"><label>Stock mínimo</label><input class="form-control" type="number" step="0.01"
                                                                        th:field="*{stockMinimo}"></div>
                <div class="col-12"><label>Descripción</label><textarea class="form-control"
                                                                        th:field="*{descripcion}"></textarea></div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary">Guardar material</button>
            </div>
        </form>
    </section>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
