<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle de inventario')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="app-main">
    <div th:replace="~{fragments/layout :: topbar('Detalle de inventario')}"></div>
    <section class="content">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="page-actions">
            <div><h2 th:text="${material.nombre}"></h2>
                <p th:text="${material.codigo}"></p></div>
        </div>
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="metric accent"><span>Stock actual</span><b th:text="${material.stockActual}"></b><small
                        th:text="${material.unidadMedida}"></small></div>
                <form class="surface form-surface mt-4"
                      th:action="@{/inventario/{id}/movimiento(id=${material.idMaterial})}" method="post"><h3>
                    Movimiento</h3><label>Usuario</label><select class="form-select" name="idUsuario">
                    <option th:each="u:${usuarios}" th:value="${u.idUsuario}" th:text="${u.nombres}"></option>
                </select><label class="mt-3">Tipo</label><select class="form-select" name="tipo">
                    <option>ENTRADA</option>
                    <option>SALIDA</option>
                </select><label class="mt-3">Cantidad</label><input class="form-control" type="number" step="0.01"
                                                                    name="cantidad" required><label
                        class="mt-3">Motivo</label><input class="form-control" name="motivo"><input type="hidden"
                                                                                                    name="idRequerimiento"><input
                        type="hidden" name="idComprobante"><label class="mt-3">Observaciones</label><textarea
                        class="form-control" name="observaciones"></textarea>
                    <button class="btn btn-primary w-100 mt-3">Registrar movimiento</button>
                </form>
            </div>
            <div class="col-lg-8">
                <div class="surface">
                    <div class="surface-head"><h3>Historial de movimientos</h3></div>
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Tipo</th>
                            <th>Cantidad</th>
                            <th>Motivo</th>
                            <th>Usuario</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="m:${movimientos}">
                            <td th:text="${m.fechaMovimiento}"></td>
                            <td th:text="${m.tipoMovimiento}"></td>
                            <td th:text="${m.cantidad}"></td>
                            <td th:text="${m.motivo ?: '—'}"></td>
                            <td th:text="${m.usuario.nombres}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
